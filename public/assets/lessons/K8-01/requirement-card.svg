<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="把“做个项目”写成可验收的任务单">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE ECHO SPIRE / 检修手册 · K8-01</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">把“做个项目”写成可验收的任务单</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="1088" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  
    <rect x="90" y="210" width="500" height="140" rx="10" fill="#0e1d27" stroke="#2a4a5e"/>
    <text class="zh" x="114" y="252" fill="#6fe3c8" font-size="20">需求</text>
    <text class="zh" x="114" y="298" fill="#e8eef2" font-size="15">冷库控制器恢复 5V 供电，</text>
    <text class="zh" x="114" y="328" fill="#e8eef2" font-size="15">且故障可复位</text>
    <rect x="630" y="210" width="500" height="140" rx="10" fill="#0e1d27" stroke="#2a4a5e"/>
    <text class="zh" x="654" y="252" fill="#f2c56b" font-size="20">约束</text>
    <text class="zh" x="654" y="298" fill="#e8eef2" font-size="15">24V SELV、不改原配电箱、</text>
    <text class="zh" x="654" y="328" fill="#e8eef2" font-size="15">预算 ≤ 200 元</text>
    <rect x="90" y="370" width="500" height="140" rx="10" fill="#0e1d27" stroke="#2a4a5e"/>
    <text class="zh" x="114" y="412" fill="#6fe3c8" font-size="20">验收</text>
    <text class="zh" x="114" y="458" fill="#e8eef2" font-size="15">电压 4.75–5.25V、纹波 ≤30mV</text>
    <text class="zh" x="114" y="488" fill="#e8eef2" font-size="15">断电重启自恢复</text>
    <rect x="630" y="370" width="500" height="140" rx="10" fill="#0e1d27" stroke="#2a4a5e"/>
    <text class="zh" x="654" y="412" fill="#8aa0ad" font-size="20">任务</text>
    <text class="zh" x="654" y="458" fill="#e8eef2" font-size="15">选型 / 线径 / 连接 /</text>
    <text class="zh" x="654" y="488" fill="#e8eef2" font-size="15">保险丝 / 上电测试</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学示例：任务单为模板；真实项目还需风险评估与验收人。</text>
</svg>
