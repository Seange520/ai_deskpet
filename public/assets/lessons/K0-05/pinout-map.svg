<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="引脚图：丝印不等于 GPIO">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K0-05</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">引脚图：丝印不等于 GPIO</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="1088" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <rect x="300" y="200" width="600" height="340" rx="12" fill="#0e1d27" stroke="#6fe3c8" stroke-width="2"/>
  <text class="zh" x="600" y="240" text-anchor="middle" fill="#6fe3c8" font-size="20">ESP32-S3 开发板（示意）</text>
  <rect x="320" y="270" width="52" height="26" rx="4" fill="#12242f" stroke="#8aa0ad"/><rect x="390" y="270" width="52" height="26" rx="4" fill="#12242f" stroke="#8aa0ad"/><rect x="460" y="270" width="52" height="26" rx="4" fill="#12242f" stroke="#8aa0ad"/><rect x="530" y="270" width="52" height="26" rx="4" fill="#12242f" stroke="#8aa0ad"/><rect x="600" y="270" width="52" height="26" rx="4" fill="#12242f" stroke="#8aa0ad"/><rect x="670" y="270" width="52" height="26" rx="4" fill="#12242f" stroke="#8aa0ad"/><rect x="740" y="270" width="52" height="26" rx="4" fill="#12242f" stroke="#8aa0ad"/><rect x="810" y="270" width="52" height="26" rx="4" fill="#12242f" stroke="#8aa0ad"/>
  <rect x="320" y="444" width="52" height="26" rx="4" fill="#12242f" stroke="#8aa0ad"/><rect x="390" y="444" width="52" height="26" rx="4" fill="#12242f" stroke="#8aa0ad"/><rect x="460" y="444" width="52" height="26" rx="4" fill="#12242f" stroke="#8aa0ad"/><rect x="530" y="444" width="52" height="26" rx="4" fill="#12242f" stroke="#8aa0ad"/><rect x="600" y="444" width="52" height="26" rx="4" fill="#12242f" stroke="#8aa0ad"/><rect x="670" y="444" width="52" height="26" rx="4" fill="#12242f" stroke="#8aa0ad"/><rect x="740" y="444" width="52" height="26" rx="4" fill="#12242f" stroke="#8aa0ad"/><rect x="810" y="444" width="52" height="26" rx="4" fill="#12242f" stroke="#8aa0ad"/>
  <text class="num" x="600" y="380" text-anchor="middle" fill="#f2c56b" font-size="22">GPIO4 ≠ 引脚 4</text>
  <text class="zh" x="600" y="420" text-anchor="middle" fill="#8aa0ad" font-size="16">看开发板丝印，再对照数据手册</text>
  <text class="zh" x="600" y="500" text-anchor="middle" fill="#8aa0ad" font-size="15">3V3 / 5V / GND 为供电脚；GPIO 通常 3.3V 逻辑</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学示例：不同开发板引脚定义不同；接线前必须查对应板卡资料并断电核对。</text>
</svg>
