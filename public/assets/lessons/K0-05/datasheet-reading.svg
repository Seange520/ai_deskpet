<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="三步读手册：额定、特性、引脚">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K0-05 · 数据手册</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">三步读手册：额定、特性、引脚</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="1088" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  
    <rect x="90" y="230" width="320" height="180" rx="10" fill="#0e1d27" stroke="#2a4a5e"/>
    <text class="zh" x="250" y="286" text-anchor="middle" fill="#ff7a6b" font-size="20">① 绝对最大额定值</text>
    <text class="zh" x="250" y="330" text-anchor="middle" fill="#e8eef2" font-size="16">超过会损坏，不等于可长期工作</text>
    <rect x="440" y="230" width="320" height="180" rx="10" fill="#0e1d27" stroke="#2a4a5e"/>
    <text class="zh" x="600" y="286" text-anchor="middle" fill="#f2c56b" font-size="20">② 电气特性</text>
    <text class="zh" x="600" y="330" text-anchor="middle" fill="#e8eef2" font-size="16">工作电压/电流/逻辑电平范围</text>
    <rect x="790" y="230" width="320" height="180" rx="10" fill="#0e1d27" stroke="#2a4a5e"/>
    <text class="zh" x="950" y="286" text-anchor="middle" fill="#6fe3c8" font-size="20">③ 引脚定义</text>
    <text class="zh" x="950" y="330" text-anchor="middle" fill="#e8eef2" font-size="16">功能、复用、上电默认状态</text>
  <text class="zh" x="90" y="470" fill="#e8eef2" font-size="17">先找“能不能用”，再找“怎么用”，最后找“接哪个脚”。</text>
  <text class="zh" x="90" y="510" fill="#8aa0ad" font-size="16">参数以你手上板卡版本为准；网上教程可能对应旧版。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学示例：数据手册为权威来源；接线前断电并核对引脚定义。</text>
</svg>
