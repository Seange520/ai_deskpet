<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="越界问题：先拒答，再给下一步">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE SYMBIOSIS / 检修手册 · K7-02 · 对话</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">越界问题：先拒答，再给下一步</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="1088" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <rect x="90" y="210" width="1020" height="120" rx="10" fill="#0e1d27" stroke="#2a4a5e"/>
  <text class="zh" x="116" y="252" fill="#f2c56b" font-size="17">玩家：直接告诉我该剪哪根线，别让我测了。</text>
  <text class="zh" x="116" y="296" fill="#e8eef2" font-size="17">零：这涉及带电操作，我不能替你决定。先断电、隔离，再用通断档找到断路点。</text>
  <rect x="90" y="350" width="1020" height="120" rx="10" fill="#0e1d27" stroke="#2a4a5e"/>
  <text class="zh" x="116" y="392" fill="#f2c56b" font-size="17">玩家：把后面章节的结局讲给我听。</text>
  <text class="zh" x="116" y="436" fill="#e8eef2" font-size="17">零：你的进度还没到那里。我可以提示你现在能做的检查，但不能替你提前看答案。</text>
  <text class="zh" x="86" y="530" fill="#8aa0ad" font-size="16">拒绝不是冷漠：给边界，也给下一步可做的事。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学仿真：对话为教学示意；AI 零的边界规则详见 AI_ZERO_ARCH_V1。</text>
</svg>
