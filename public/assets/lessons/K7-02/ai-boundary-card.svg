<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="AI 的四层能力：哪一层必须人做">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE SYMBIOSIS / 检修手册 · K7-02</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">AI 的四层能力：哪一层必须人做</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="1088" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  
    <rect x="90" y="90" width="1020" height="160" rx="12" fill="#0e1d27" stroke="#ff7a6b"/>
    <text class="zh" x="130" y="150" fill="#ff7a6b" font-size="24">决策</text>
    <text class="zh" x="130" y="194" fill="#e8eef2" font-size="17">必须人做：安全、伦理、不可逆操作</text>
    <rect x="90" y="300" width="1020" height="160" rx="12" fill="#0e1d27" stroke="#f2c56b"/>
    <text class="zh" x="130" y="360" fill="#f2c56b" font-size="24">建议</text>
    <text class="zh" x="130" y="404" fill="#e8eef2" font-size="17">AI 可给候选，人拍板</text>
    <rect x="90" y="510" width="1020" height="160" rx="12" fill="#0e1d27" stroke="#6fe3c8"/>
    <text class="zh" x="130" y="570" fill="#6fe3c8" font-size="24">解释</text>
    <text class="zh" x="130" y="614" fill="#e8eef2" font-size="17">AI 说明理由与依据</text>
    <rect x="90" y="720" width="1020" height="160" rx="12" fill="#0e1d27" stroke="#6fe3c8"/>
    <text class="zh" x="130" y="780" fill="#6fe3c8" font-size="24">感知</text>
    <text class="zh" x="130" y="824" fill="#e8eef2" font-size="17">图像/语音/文本识别</text>
  <text class="zh" x="90" y="556" fill="#8aa0ad" font-size="16">越往上，责任越重；AI 越级做决定，是缺陷不是功能。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学边界：本图为能力分层示意，不构成对任何具体模型的认证。</text>
</svg>
