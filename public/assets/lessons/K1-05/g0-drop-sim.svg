<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="量一处压降，判断接点健康度">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes heat{0%,100%{fill:#f2c56b}50%{fill:#ff7a6b}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K1-05 · 检修演练</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">量一处压降，判断接点健康度</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="470" height="400" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="82" y="204" fill="#6fe3c8" font-size="17">操作顺序</text>
  <text class="zh" x="82" y="252 + i*52" fill="#e8eef2" font-size="18">① 断电，确认 0V</text><text class="zh" x="82" y="252 + i*52" fill="#e8eef2" font-size="18">② 通断档：量接点两端是否 ohm 级</text><text class="zh" x="82" y="252 + i*52" fill="#e8eef2" font-size="18">③ 送电，带载</text><text class="zh" x="82" y="252 + i*52" fill="#e8eef2" font-size="18">④ 电压档：量接点到电源 0V 的压降</text><text class="zh" x="82" y="252 + i*52" fill="#e8eef2" font-size="18">⑤ 压降 ≤0.1V 健康；>0.5V 处理接点</text>
</g>
<g>
  <rect x="574" y="170" width="570" height="400" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="600" y="204" fill="#6fe3c8" font-size="17">检修台读数</text>
  <rect x="600" y="232" width="300" height="110" rx="8" fill="#162b2f" stroke="#6fe3c8" stroke-width="2"/>
  <text class="num" x="750" y="306" text-anchor="middle" fill="#6fe3c8" font-size="46">0.42</text>
  <text class="num" x="880" y="300" text-anchor="end" fill="#6fe3c8" font-size="20">V</text>
  <text class="zh" x="600" y="382" fill="#e8eef2" font-size="18">0.42V：可疑，清洗/压接后重测</text>
  <text class="zh" x="600" y="418" fill="#e8eef2" font-size="18">若压降随负载明显变大 → 接点电阻大</text>
  <text class="zh" x="600" y="454" fill="#e8eef2" font-size="18">处理后复测 ≤0.1V 才算修好</text>
  <text class="zh" x="600" y="504" fill="#8aa0ad" font-size="16">负载电流不变时，压降能直接暴露接触电阻。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">仿真演练：读数来自确定性教学模型，注意断电再接线。</text>
</svg>
