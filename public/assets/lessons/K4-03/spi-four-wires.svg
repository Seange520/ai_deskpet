<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="SPI：四根线，时钟带着数据走">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes sweep{0%{transform:translateX(0)}100%{transform:translateX(640px)}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE WEAVE / 检修手册 · K4-03</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">SPI：四根线，时钟带着数据走</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="560" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="82" y="204" fill="#6fe3c8" font-size="17">四根线各管什么</text>
  
    <rect x="82" y="232" width="500" height="60" rx="8" fill="#0e1d27" stroke="#6fe3c8"/>
    <text class="num" x="110" y="272" fill="#6fe3c8" font-size="19">SCK</text>
    <text class="zh" x="200" y="272" fill="#e8eef2" font-size="17">时钟：主设备敲节拍</text>
    <rect x="82" y="310" width="500" height="60" rx="8" fill="#0e1d27" stroke="#f2c56b"/>
    <text class="num" x="110" y="350" fill="#f2c56b" font-size="19">MOSI</text>
    <text class="zh" x="200" y="350" fill="#e8eef2" font-size="17">主 → 从 数据</text>
    <rect x="82" y="388" width="500" height="60" rx="8" fill="#0e1d27" stroke="#f2c56b"/>
    <text class="num" x="110" y="428" fill="#f2c56b" font-size="19">MISO</text>
    <text class="zh" x="200" y="428" fill="#e8eef2" font-size="17">从 → 主 数据</text>
    <rect x="82" y="466" width="500" height="60" rx="8" fill="#0e1d27" stroke="#ff7a6b"/>
    <text class="num" x="110" y="506" fill="#ff7a6b" font-size="19">CS</text>
    <text class="zh" x="200" y="506" fill="#e8eef2" font-size="17">片选：选中谁</text>
</g>
<g>
  <rect x="650" y="170" width="494" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="676" y="204" fill="#6fe3c8" font-size="17">时序要点</text>
  <text class="zh" x="676" y="250" fill="#e8eef2" font-size="17">CS 拉低 → 选中从设备</text>
  <text class="zh" x="676" y="290" fill="#e8eef2" font-size="17">SCK 每个边沿移一位数据</text>
  <text class="zh" x="676" y="330" fill="#e8eef2" font-size="17">MOSI/MISO 同时收发（全双工）</text>
  <text class="zh" x="676" y="370" fill="#e8eef2" font-size="17">CS 拉高 → 结束</text>
  <text class="zh" x="676" y="432" fill="#8aa0ad" font-size="16">模式（CPOL/CPHA）不对，数据就会错位。</text>
  <text class="zh" x="676" y="504" fill="#f2c56b" font-size="16">SPI 快，但线多；多从设备要多个 CS。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学示例：SPI 模式与最大时钟频率以器件手册为准。</text>
</svg>
