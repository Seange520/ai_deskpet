<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="同一个时钟，四种采样约定">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes sweep{0%{transform:translateX(0)}100%{transform:translateX(640px)}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE WEAVE / 检修手册 · K4-03 · 模式</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">同一个时钟，四种采样约定</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="1088" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="86" y="204" fill="#6fe3c8" font-size="17">CPOL：时钟空闲时是高还是低　CPHA：在第几个边沿采样</text>
  <text class="zh" x="86" y="290" fill="#e8eef2" font-size="18">模式 0：空闲低，上升沿采样</text>
    <text class="num" x="560" y="290" fill="#8aa0ad" font-size="16">CPOL=0 CPHA=0</text>
    <path d="M640 300 h40 v-40 h40 v40 h40 v-40 h40 v40 h40 v-40 h40 v40 h40" fill="none" stroke="#6fe3c8" stroke-width="2"/><text class="zh" x="86" y="370" fill="#e8eef2" font-size="18">模式 1：空闲低，下降沿采样</text>
    <text class="num" x="560" y="370" fill="#8aa0ad" font-size="16">CPOL=0 CPHA=1</text>
    <path d="M640 380 h40 v-40 h40 v40 h40 v-40 h40 v40 h40 v-40 h40 v40 h40" fill="none" stroke="#6fe3c8" stroke-width="2"/><text class="zh" x="86" y="450" fill="#e8eef2" font-size="18">模式 2：空闲高，下降沿采样</text>
    <text class="num" x="560" y="450" fill="#8aa0ad" font-size="16">CPOL=1 CPHA=0</text>
    <path d="M640 460 h40 v-40 h40 v40 h40 v-40 h40 v40 h40 v-40 h40 v40 h40" fill="none" stroke="#6fe3c8" stroke-width="2"/><text class="zh" x="86" y="530" fill="#e8eef2" font-size="18">模式 3：空闲高，上升沿采样</text>
    <text class="num" x="560" y="530" fill="#8aa0ad" font-size="16">CPOL=1 CPHA=1</text>
    <path d="M640 540 h40 v-40 h40 v40 h40 v-40 h40 v40 h40 v-40 h40 v40 h40" fill="none" stroke="#6fe3c8" stroke-width="2"/>
  <text class="zh" x="86" y="560" fill="#8aa0ad" font-size="16">主从双方必须约定同一个模式，否则读到的数据会左移/右移一位。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学示例：波形为示意；实际以器件 datasheet 的模式参数为准。</text>
</svg>
