<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="先接表笔，再伸手">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fe3c8" stop-opacity=".18"/><stop offset="1" stop-color="#12242f" stop-opacity="0"/></linearGradient>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes handmove{0%,100%{transform:translate(0,0)}50%{transform:translate(18px,-6px)}}
@keyframes heat{0%,100%{fill:#f2c56b}50%{fill:#ff7a6b}}
@keyframes spike{0%{stroke-dashoffset:900}100%{stroke-dashoffset:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K0-01 · 动画</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">先接表笔，再伸手</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>
<g>
  <g>
<rect x="110" y="250" width="300" height="210" rx="12" fill="#0e1d27" stroke="#2a4a5e" stroke-width="2"/>
<rect x="128" y="268" width="264" height="92" rx="6" fill="#162b2f" stroke="#6fe3c8" stroke-width="2"/>
<text class="num" x="260" y="328" text-anchor="middle" fill="#6fe3c8" font-size="44" font-weight="700">0.0</text>
<text class="num" x="354" y="324" text-anchor="end" fill="#6fe3c8" font-size="18">V</text>
<text class="zh" x="260" y="388" text-anchor="middle" fill="#e8eef2" font-size="17">已断电</text>
<text class="zh" x="260" y="416" text-anchor="middle" fill="#8aa0ad" font-size="15">黑笔 COM · 红笔 VΩ</text>
<circle cx="164" cy="406" r="9" fill="#0b1620" stroke="#f2c56b" stroke-width="3"/>
<circle cx="202" cy="406" r="9" fill="#0b1620" stroke="#2a4a5e" stroke-width="3"/>
</g>
  <g>
    <rect x="620" y="235" width="420" height="260" rx="12" fill="#12242f" stroke="#2a4a5e"/>
    <text class="zh" x="650" y="275" fill="#6fe3c8" font-size="18">配电盒端子</text>
    <rect x="680" y="330" width="300" height="70" rx="8" fill="#0e1d27" stroke="#2a4a5e"/>
    <circle cx="760" cy="365" r="14" fill="#2a3f4d" stroke="#f2c56b" stroke-width="3"/>
    <circle cx="900" cy="365" r="14" fill="#2a3f4d" stroke="#2a4a5e" stroke-width="3"/>
    <text class="num" x="760" y="420" text-anchor="middle" fill="#f2c56b" font-size="15">L</text>
    <text class="num" x="900" y="420" text-anchor="middle" fill="#8aa0ad" font-size="15">N</text>
    <text class="zh" x="650" y="470" fill="#8aa0ad" font-size="16">表笔先搭好，再把手靠近；读数 0.0V 才继续。</text>
    <g style="animation:handmove 2.4s ease-in-out infinite">
      <path d="M1040 340 q -40 10 -70 40" fill="none" stroke="#e8eef2" stroke-width="6" stroke-linecap="round"/>
      <text class="zh" x="905" y="300" fill="#f2c56b" font-size="16">等读数稳定</text>
    </g>
  </g>
  <g style="animation:blink 1.6s steps(2) infinite"><circle cx="140" cy="500" r="8" fill="#6fe3c8"/></g>
  <text class="zh" x="160" y="506" fill="#6fe3c8" font-size="16">数字表稳定后再动作</text>
  </g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">字幕：第一步不是动手，是让表先说话。</text>
</svg>
