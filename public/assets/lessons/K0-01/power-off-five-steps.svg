<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="断电五步：先断，再验，再动手">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fe3c8" stop-opacity=".18"/><stop offset="1" stop-color="#12242f" stop-opacity="0"/></linearGradient>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes handmove{0%,100%{transform:translate(0,0)}50%{transform:translate(18px,-6px)}}
@keyframes heat{0%,100%{fill:#f2c56b}50%{fill:#ff7a6b}}
@keyframes spike{0%{stroke-dashoffset:900}100%{stroke-dashoffset:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K0-01</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">断电五步：先断，再验，再动手</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>
<g>
  <g><rect x="70" y="200" width="250" height="230" rx="12" fill="#12242f" stroke="#2a4a5e"/>
    <circle cx="110" cy="245" r="22" fill="#0b1620" stroke="#f2c56b" stroke-width="3"/>
    <text class="num" x="110" y="253" text-anchor="middle" fill="#f2c56b" font-size="22">1</text>
    <text class="zh" x="146" y="253" fill="#e8eef2" font-size="26" font-weight="700">断电</text>
    <text class="zh" x="100" y="320" fill="#8aa0ad" font-size="18">拔插头 / 断开关</text>
    <text class="zh" x="100" y="350" fill="#e8eef2" font-size="16">M120 300 h60 M170 285 l30 30 l-30 30</text></g><g><rect x="350" y="200" width="250" height="230" rx="12" fill="#12242f" stroke="#2a4a5e"/>
    <circle cx="390" cy="245" r="22" fill="#0b1620" stroke="#f2c56b" stroke-width="3"/>
    <text class="num" x="390" y="253" text-anchor="middle" fill="#f2c56b" font-size="22">2</text>
    <text class="zh" x="426" y="253" fill="#e8eef2" font-size="26" font-weight="700">验电</text>
    <text class="zh" x="380" y="320" fill="#8aa0ad" font-size="18">表笔测 0.0V</text>
    <text class="zh" x="380" y="350" fill="#e8eef2" font-size="16">M400 300 h60</text></g><g><rect x="630" y="200" width="250" height="230" rx="12" fill="#12242f" stroke="#2a4a5e"/>
    <circle cx="670" cy="245" r="22" fill="#0b1620" stroke="#f2c56b" stroke-width="3"/>
    <text class="num" x="670" y="253" text-anchor="middle" fill="#f2c56b" font-size="22">3</text>
    <text class="zh" x="706" y="253" fill="#e8eef2" font-size="26" font-weight="700">放电</text>
    <text class="zh" x="660" y="320" fill="#8aa0ad" font-size="18">电容等 30 秒</text>
    <text class="zh" x="660" y="350" fill="#e8eef2" font-size="16">M650 300 h60</text></g><g><rect x="910" y="200" width="250" height="230" rx="12" fill="#12242f" stroke="#2a4a5e"/>
    <circle cx="950" cy="245" r="22" fill="#0b1620" stroke="#f2c56b" stroke-width="3"/>
    <text class="num" x="950" y="253" text-anchor="middle" fill="#f2c56b" font-size="22">4</text>
    <text class="zh" x="986" y="253" fill="#e8eef2" font-size="26" font-weight="700">隔离挂牌</text>
    <text class="zh" x="940" y="320" fill="#8aa0ad" font-size="18">谁挂牌谁摘牌</text>
    <text class="zh" x="940" y="350" fill="#e8eef2" font-size="16">M900 300 h50</text></g>
  <g><rect x="1000" y="200" width="130" height="230" rx="12" fill="none" stroke="#6fe3c8" stroke-dasharray="6 8"/>
  <text class="zh" x="1065" y="300" text-anchor="middle" fill="#6fe3c8" font-size="20">复测</text>
  <text class="zh" x="1065" y="330" text-anchor="middle" fill="#8aa0ad" font-size="15">0.0V 才算安全</text></g>
  <path d="M320 315 H 380 M 530 315 H 590 M 780 315 H 840" stroke="#2a4a5e" stroke-width="3" marker-end="url(#a)"/>
  </g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">安全红线：断电不等于安全；验电、放电、挂牌、复测，一步都不能省。</text>
</svg>
