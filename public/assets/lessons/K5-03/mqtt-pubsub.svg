<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="一次发布，谁在听谁处理">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes sweep{0%{transform:translateX(0)}100%{transform:translateX(640px)}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE ECHO / 检修手册 · K5-03 · 发布/订阅</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">一次发布，谁在听谁处理</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="1088" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <g><rect x="90" y="250" width="220" height="100" rx="8" fill="#0e1d27" stroke="#f2c56b" stroke-width="2"/>
<text class="zh" x="200" y="284" text-anchor="middle" fill="#f2c56b" font-size="19">发布者</text>
<text class="zh" x="200" y="312" text-anchor="middle" fill="#8aa0ad" font-size="15">传感器/网关</text></g>
  <g><rect x="470" y="220" width="260" height="160" rx="8" fill="#0e1d27" stroke="#6fe3c8" stroke-width="2"/>
<text class="zh" x="600" y="254" text-anchor="middle" fill="#6fe3c8" font-size="19">Broker</text>
<text class="zh" x="600" y="282" text-anchor="middle" fill="#8aa0ad" font-size="15">主题路由 + 队列</text></g>
  <g><rect x="880" y="210" width="220" height="80" rx="8" fill="#0e1d27" stroke="#6fe3c8" stroke-width="2"/>
<text class="zh" x="990" y="244" text-anchor="middle" fill="#6fe3c8" font-size="19">订阅者 A</text>
<text class="zh" x="990" y="272" text-anchor="middle" fill="#8aa0ad" font-size="15">主控</text></g>
  <g><rect x="880" y="310" width="220" height="80" rx="8" fill="#0e1d27" stroke="#6fe3c8" stroke-width="2"/>
<text class="zh" x="990" y="344" text-anchor="middle" fill="#6fe3c8" font-size="19">订阅者 B</text>
<text class="zh" x="990" y="372" text-anchor="middle" fill="#8aa0ad" font-size="15">手机 App</text></g>
  <g><rect x="880" y="410" width="220" height="80" rx="8" fill="#0e1d27" stroke="#6fe3c8" stroke-width="2"/>
<text class="zh" x="990" y="444" text-anchor="middle" fill="#6fe3c8" font-size="19">订阅者 C</text>
<text class="zh" x="990" y="472" text-anchor="middle" fill="#8aa0ad" font-size="15">记录仪</text></g>
  <line x1="310" y1="300" x2="470" y2="300" stroke="#f2c56b" stroke-width="3"/>
  <line x1="730" y1="280" x2="880" y2="250" stroke="#6fe3c8" stroke-width="3"/>
  <line x1="730" y1="300" x2="880" y2="350" stroke="#6fe3c8" stroke-width="3"/>
  <line x1="730" y1="320" x2="880" y2="450" stroke="#6fe3c8" stroke-width="3"/>
  <text class="num" x="90" y="540" fill="#f2c56b" font-size="16">发布主题：forge/street/lamp1/state</text>
  <text class="zh" x="90" y="576" fill="#8aa0ad" font-size="16">发布者不需要知道订阅者是谁——这就是解耦。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学示例：MQTT 为异步通信；QoS 与 Retain 策略影响可靠性。</text>
</svg>
