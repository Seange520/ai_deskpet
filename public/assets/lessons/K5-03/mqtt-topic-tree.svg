<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="MQTT 主题：一棵可订阅的树">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes sweep{0%{transform:translateX(0)}100%{transform:translateX(640px)}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE ECHO / 检修手册 · K5-03</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">MQTT 主题：一棵可订阅的树</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="560" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  
    <text class="num" x="86" y="240" fill="#6fe3c8" font-size="18">forge/</text>
    <text class="num" x="86" y="286" fill="#6fe3c8" font-size="18">  forge/street/</text>
    <text class="num" x="86" y="332" fill="#6fe3c8" font-size="18">    forge/street/lamp1</text>
    <text class="num" x="86" y="378" fill="#6fe3c8" font-size="18">      forge/street/lamp1/state</text>
    <text class="num" x="86" y="424" fill="#f2c56b" font-size="18">        echo/</text>
    <text class="num" x="86" y="470" fill="#f2c56b" font-size="18">          echo/market/</text>
    <text class="num" x="86" y="516" fill="#f2c56b" font-size="18">            echo/market/bell</text>
  <text class="zh" x="86" y="560" fill="#8aa0ad" font-size="16">层级用 / 分隔；topic 是“地址”，payload 才是“内容”。</text>
</g>
<g>
  <rect x="650" y="170" width="494" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="676" y="204" fill="#6fe3c8" font-size="17">通配符与订阅</text>
  <text class="num" x="676" y="252" fill="#e8eef2" font-size="17">+  单层通配</text>
  <text class="num" x="676" y="292" fill="#e8eef2" font-size="17">#  多层通配（须在末尾）</text>
  <text class="num" x="676" y="332" fill="#e8eef2" font-size="17">forge/street/+/state</text>
  <text class="num" x="676" y="372" fill="#e8eef2" font-size="17">forge/#</text>
  <text class="zh" x="676" y="440" fill="#8aa0ad" font-size="16">QoS 0/1/2：至多一次 / 至少一次 / 恰好一次</text>
  <text class="zh" x="676" y="500" fill="#8aa0ad" font-size="16">发布前想清楚：谁订阅、丢一条会怎样。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学示例：真实 MQTT 还涉及鉴权、遗嘱消息与保留消息。</text>
</svg>
