<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="IC-06 计数器：时钟沿计数与回绕">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#12262b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="#08161a"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <text x="48" y="64" fill="#4fd1c5" font-family="Consolas, monospace" font-size="17" letter-spacing="2">THE FORGE / 检修手册 · IC-06</text>
  <text x="48" y="108" fill="#e6f7f5" font-family="Microsoft YaHei, sans-serif" font-size="38" font-weight="700">计数器：把时钟沿数出来</text>
  <line x1="48" y1="128" x2="1152" y2="128" stroke="#1d3a40" stroke-width="2"/>

  <g font-family="Microsoft YaHei, sans-serif">
    <rect x="48" y="168" width="520" height="304" rx="12" fill="#0d2328" stroke="#2b5b63"/>
    <text x="72" y="206" fill="#8fe3d8" font-size="20">① 时钟沿 → 计数加一</text>
    <g font-family="Consolas, monospace" font-size="16" fill="#d7ece9">
      <text x="80" y="246">CLK  _/‾\_/‾\_/‾\</text>
      <text x="80" y="280">CNT   0   1   2   3</text>
      <text x="80" y="314" fill="#6f8f99">每来一个上升沿，计数值 +1</text>
    </g>
    <rect x="72" y="338" width="472" height="46" rx="8" fill="#12302a" stroke="#4fd1c5"/>
    <text x="88" y="367" fill="#e6f7f5" font-size="16">复位 R=1：计数清回 0</text>
    <text x="72" y="410" fill="#f6c177" font-size="16">4 位计数范围：0–15（共 16 个数）</text>
    <text x="72" y="442" fill="#6f8f99" font-size="14">数到 15 后再来一个沿，回绕到 0。</text>

    <rect x="616" y="168" width="536" height="304" rx="12" fill="#0d2328" stroke="#2b5b63"/>
    <text x="640" y="206" fill="#8fe3d8" font-size="20">② 回绕与分频</text>
    <g font-family="Consolas, monospace" font-size="16" fill="#d7ece9">
      <text x="648" y="248">… 13 → 14 → 15 → 0 → 1 …</text>
    </g>
    <text x="640" y="288" fill="#9fb8bd" font-size="15">回绕：像秒表的 59 → 00，进位给下一位。</text>
    <rect x="640" y="310" width="488" height="58" rx="8" fill="#1a2a33" stroke="#2b5b63"/>
    <text x="656" y="334" fill="#e6f7f5" font-size="16">2 分频：计数最低位就是时钟的一半</text>
    <text x="656" y="356" fill="#9fb8bd" font-size="13">每两个输入沿，输出一个完整周期。</text>
    <text x="640" y="400" fill="#f6c177" font-size="15">4 分频：每 4 个输入沿，输出翻一次。</text>
    <text x="640" y="430" fill="#6f8f99" font-size="14">分频 = 把快节拍变慢，给不同电路用。</text>

    <rect x="48" y="500" width="1104" height="104" rx="12" fill="#12262b" stroke="#2b5b63"/>
    <text x="72" y="534" fill="#8fe3d8" font-size="19">③ 读数与验收</text>
    <text x="72" y="566" fill="#e6f7f5" font-family="Consolas, monospace" font-size="17">打 2 个沿 → 计数 2；复位 → 0；数到 15 再打沿 → 0</text>
    <text x="72" y="592" fill="#9fb8bd" font-size="14">计数器=触发器组+进位逻辑；先写时序表，再逐沿核对读数。</text>

    <text x="48" y="648" fill="#6f8f99" font-size="13">教学示意：计数器输出接负载前确认扇出；实测先断电、核对电源与地，再逐沿验收。</text>
  </g>
</svg>
