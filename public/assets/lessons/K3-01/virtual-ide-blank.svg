<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="把事情交给代码：让灯按节奏闪">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes heat{0%,100%{fill:#f2c56b}50%{fill:#ff7a6b}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K3-01 · 虚拟 IDE</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">把事情交给代码：让灯按节奏闪</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="1088" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <rect x="86" y="200" width="700" height="340" rx="8" fill="#0e1d27" stroke="#2a4a5e"/>
  <text class="num" x="112" y="246" fill="#8aa0ad" font-size="15">main.c</text>
  <text class="num" x="112" y="294" fill="#6fe3c8" font-size="17">void loop() {</text>
  <text class="num" x="140" y="330" fill="#e8eef2" font-size="17">digitalWrite(LED, HIGH);</text>
  <text class="num" x="140" y="366" fill="#e8eef2" font-size="17">delay(500);</text>
  <text class="num" x="140" y="402" fill="#e8eef2" font-size="17">digitalWrite(LED, LOW);</text>
  <text class="num" x="140" y="438" fill="#e8eef2" font-size="17">delay(500);</text>
  <text class="num" x="112" y="474" fill="#6fe3c8" font-size="17">}</text>
  <rect x="820" y="200" width="290" height="340" rx="8" fill="#0e1d27" stroke="#2a4a5e"/>
  <text class="zh" x="846" y="240" fill="#6fe3c8" font-size="17">状态面板</text>
  <text class="zh" x="846" y="286" fill="#e8eef2" font-size="16">编译：✓ 0 错误</text>
  <text class="zh" x="846" y="322" fill="#e8eef2" font-size="16">运行：✓ 虚拟板在线</text>
  <text class="zh" x="846" y="358" fill="#e8eef2" font-size="16">引脚：LED 3.3V 闪烁</text>
  <text class="zh" x="846" y="418" fill="#8aa0ad" font-size="15">改一个参数，再运行一次：</text>
  <text class="zh" x="846" y="450" fill="#8aa0ad" font-size="15">500 → 250，观察频率变化。</text>
  <text class="zh" x="846" y="510" fill="#f2c56b" font-size="15">代码是可验证的工程记录。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">虚拟 IDE：不连接真机、不编译真实固件，仅做教学演示。</text>
</svg>
