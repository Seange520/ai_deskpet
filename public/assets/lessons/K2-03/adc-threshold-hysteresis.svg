<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="ADC：把连续电压切成数字阶梯">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes heat{0%,100%{fill:#f2c56b}50%{fill:#ff7a6b}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K2-03</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">ADC：把连续电压切成数字阶梯</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g><rect x="56" y="170" width="470" height="200" rx="10" fill="#12242f" stroke="#2a4a5e"/>
<text class="zh" x="76" y="200" fill="#6fe3c8" font-size="17">12 位 ADC：4096 级台阶</text><text class="zh" x="76" y="224" fill="#e8eef2" font-size="18">3.3V 参考电压</text><text class="zh" x="76" y="256" fill="#e8eef2" font-size="18">1 LSB ≈ 3.3V / 4096 ≈ 0.8mV</text><text class="zh" x="76" y="288" fill="#e8eef2" font-size="18">1.65V → 约 2048</text><text class="zh" x="76" y="320" fill="#e8eef2" font-size="18">读数不是无限精确，有量化误差</text></g>
<g><rect x="56" y="390" width="470" height="200" rx="10" fill="#12242f" stroke="#2a4a5e"/>
<text class="zh" x="76" y="420" fill="#6fe3c8" font-size="17">阈值要设迟滞</text><text class="zh" x="76" y="444" fill="#e8eef2" font-size="18">超过上限才跳：开</text><text class="zh" x="76" y="476" fill="#e8eef2" font-size="18">低于下限才回：关</text><text class="zh" x="76" y="508" fill="#e8eef2" font-size="18">中间留一条不动作带</text><text class="zh" x="76" y="540" fill="#e8eef2" font-size="18">否则噪声会让输出来回抖</text></g>
<g>
  <rect x="570" y="170" width="580" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <line x1="620" y1="520" x2="1110" y2="520" stroke="#8aa0ad" stroke-width="2"/>
  <line x1="620" y1="520" x2="620" y2="210" stroke="#8aa0ad" stroke-width="2"/>
  <path d="M620 470 Q690 420 760 430 T900 330 T1110 260" fill="none" stroke="#6fe3c8" stroke-width="3"/>
  <line x1="620" y1="330" x2="1110" y2="330" stroke="#f2c56b" stroke-dasharray="8 6" stroke-width="2"/>
  <line x1="620" y1="380" x2="1110" y2="380" stroke="#6fe3c8" stroke-dasharray="8 6" stroke-width="2"/>
  <text class="zh" x="1110" y="322" fill="#f2c56b" font-size="16" text-anchor="end">上限：开</text>
  <text class="zh" x="1110" y="374" fill="#6fe3c8" font-size="16" text-anchor="end">下限：关</text>
  <text class="zh" x="640" y="252" fill="#8aa0ad" font-size="16">迟滞带：中间不动作</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学模型：数值为 12 位 ADC 的量化近似，噪声与真实芯片特性从简。</text>
</svg>
