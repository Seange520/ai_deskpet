<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="读数在动，阈值别贴着噪声设">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes heat{0%,100%{fill:#f2c56b}50%{fill:#ff7a6b}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K2-03 · 调阈值</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">读数在动，阈值别贴着噪声设</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="520" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="82" y="204" fill="#6fe3c8" font-size="17">调试步骤</text>
  <text class="zh" x="82" y="252 + i*56" fill="#e8eef2" font-size="18">① 采样，记录一段时间内的最大/最小值</text><text class="zh" x="82" y="252 + i*56" fill="#e8eef2" font-size="18">② 阈值放在噪声带之外，留 5–10% 裕量</text><text class="zh" x="82" y="252 + i*56" fill="#e8eef2" font-size="18">③ 设迟滞，避免抖动</text><text class="zh" x="82" y="252 + i*56" fill="#e8eef2" font-size="18">④ 边界值实测：刚好超阈值、刚好回落</text><text class="zh" x="82" y="252 + i*56" fill="#e8eef2" font-size="18">⑤ 记录阈值与测试条件</text>
</g>
<g>
  <rect x="624" y="170" width="520" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="650" y="204" fill="#6fe3c8" font-size="17">示例阈值</text>
  <rect x="650" y="232" width="440" height="150" rx="8" fill="#162b2f" stroke="#2a4a5e"/>
  <text class="num" x="676" y="290" fill="#e8eef2" font-size="22">阈值：1.65V ± 0.05V</text>
  <text class="num" x="676" y="330" fill="#e8eef2" font-size="22">迟滞：0.10V</text>
  <text class="num" x="676" y="370" fill="#8aa0ad" font-size="18">读数 1.72V → 开；1.58V → 关</text>
  <text class="zh" x="650" y="432" fill="#8aa0ad" font-size="16">阈值是“判断条件”，不是“传感器精度”。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">仿真演练：示例数值来自教学模型，实际阈值按传感器与场景调整。</text>
</svg>
