<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="PID：用误差推着系统走">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K6-02</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">PID：用误差推着系统走</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="1088" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <g><rect x="90" y="280" width="140" height="80" rx="8" fill="#0e1d27" stroke="#6fe3c8" stroke-width="2"/>
<text class="zh" x="160" y="314" text-anchor="middle" fill="#6fe3c8" font-size="19">目标</text>
<text class="zh" x="160" y="342" text-anchor="middle" fill="#8aa0ad" font-size="15">设定角</text></g>
  <g><rect x="300" y="280" width="140" height="80" rx="8" fill="#0e1d27" stroke="#f2c56b" stroke-width="2"/>
<text class="zh" x="370" y="314" text-anchor="middle" fill="#f2c56b" font-size="19">误差 e</text>
<text class="zh" x="370" y="342" text-anchor="middle" fill="#8aa0ad" font-size="15">目标 − 实际</text></g>
  <g><rect x="510" y="250" width="200" height="120" rx="8" fill="#0e1d27" stroke="#6fe3c8" stroke-width="2"/>
<text class="zh" x="610" y="284" text-anchor="middle" fill="#6fe3c8" font-size="19">控制器</text>
<text class="zh" x="610" y="312" text-anchor="middle" fill="#8aa0ad" font-size="15">P·e + I∫e + D·de/dt</text></g>
  <g><rect x="780" y="280" width="140" height="80" rx="8" fill="#0e1d27" stroke="#6fe3c8" stroke-width="2"/>
<text class="zh" x="850" y="314" text-anchor="middle" fill="#6fe3c8" font-size="19">执行器</text>
<text class="zh" x="850" y="342" text-anchor="middle" fill="#8aa0ad" font-size="15">电机</text></g>
  <g><rect x="1000" y="280" width="120" height="80" rx="8" fill="#0e1d27" stroke="#6fe3c8" stroke-width="2"/>
<text class="zh" x="1060" y="314" text-anchor="middle" fill="#6fe3c8" font-size="19">对象</text>
<text class="zh" x="1060" y="342" text-anchor="middle" fill="#8aa0ad" font-size="15">机械臂</text></g>
  <line x1="230" y1="320" x2="300" y2="320" stroke="#f2c56b" stroke-width="3"/>
  <line x1="440" y1="320" x2="510" y2="320" stroke="#f2c56b" stroke-width="3"/>
  <line x1="710" y1="320" x2="780" y2="320" stroke="#6fe3c8" stroke-width="3"/>
  <line x1="920" y1="320" x2="1000" y2="320" stroke="#6fe3c8" stroke-width="3"/>
  <path d="M1060 400 H1060 460 H600 V370" fill="none" stroke="#8aa0ad" stroke-width="2" stroke-dasharray="8 6"/>
  <text class="zh" x="86" y="470" fill="#e8eef2" font-size="17">P 看现在，I 清旧账，D 看趋势。三个一起，才稳得住。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学示例：PID 参数与机械结构强相关；示例仅为概念图，不构成整定建议。</text>
