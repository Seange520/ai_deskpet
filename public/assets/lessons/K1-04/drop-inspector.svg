<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="三处电压，找到压降在哪">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K1-04 · 诊断</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">三处电压，找到压降在哪</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="1088" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <g><rect x="90" y="300" width="170" height="90" rx="8" fill="#0e1d27" stroke="#f2c56b" stroke-width="2"/>
<text class="zh" x="175" y="334" text-anchor="middle" fill="#f2c56b" font-size="19">电源 24.0V</text>
<text class="zh" x="175" y="362" text-anchor="middle" fill="#8aa0ad" font-size="15">稳定输出</text></g>
  <g><rect x="360" y="300" width="200" height="90" rx="8" fill="#0e1d27" stroke="#6fe3c8" stroke-width="2"/>
<text class="zh" x="460" y="334" text-anchor="middle" fill="#6fe3c8" font-size="19">线路 A→B</text>
<text class="zh" x="460" y="362" text-anchor="middle" fill="#8aa0ad" font-size="15">线损 0.9V</text></g>
  <g><rect x="660" y="300" width="200" height="90" rx="8" fill="#0e1d27" stroke="#6fe3c8" stroke-width="2"/>
<text class="zh" x="760" y="334" text-anchor="middle" fill="#6fe3c8" font-size="19">负载</text>
<text class="zh" x="760" y="362" text-anchor="middle" fill="#8aa0ad" font-size="15">压缩机</text></g>
  <line x1="260" y1="345" x2="360" y2="345" stroke="#f2c56b" stroke-width="3"/>
  <line x1="560" y1="345" x2="660" y2="345" stroke="#6fe3c8" stroke-width="3"/>
  <line x1="860" y1="345" x2="1050" y2="345" stroke="#6fe3c8" stroke-width="3"/>
  <line x1="1050" y1="345" x2="1050" y2="450" stroke="#8aa0ad" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="1050" y1="450" x2="175" y2="450" stroke="#8aa0ad" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="num" x="160" y="410" fill="#e8eef2" font-size="18">A 24.0V</text>
  <text class="num" x="430" y="410" fill="#f2c56b" font-size="18">B 23.1V</text>
  <text class="num" x="730" y="410" fill="#e8eef2" font-size="18">C 0.9V</text>
  <text class="zh" x="86" y="530" fill="#e8eef2" font-size="17">压降 0.9V ÷ 电流 4A = 0.225Ω → 接触电阻偏大。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学示例：读数来自等效电路；真实测量要断电接线、选对量程。</text>
</svg>
