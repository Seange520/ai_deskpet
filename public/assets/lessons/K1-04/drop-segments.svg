<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="压降长路：0.9V 掉在了哪里">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fe3c8" stop-opacity=".18"/><stop offset="1" stop-color="#12242f" stop-opacity="0"/></linearGradient>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes handmove{0%,100%{transform:translate(0,0)}50%{transform:translate(18px,-6px)}}
@keyframes heat{0%,100%{fill:#f2c56b}50%{fill:#ff7a6b}}
@keyframes spike{0%{stroke-dashoffset:900}100%{stroke-dashoffset:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K1-04</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">压降长路：0.9V 掉在了哪里</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>
<g>
  <rect x="60" y="260" width="150" height="170" rx="10" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="135" y="305" text-anchor="middle" fill="#6fe3c8" font-size="19">24V 供电</text>
  <text class="num" x="135" y="345" text-anchor="middle" fill="#e8eef2" font-size="26">24.0 V</text>
  <text class="num" x="135" y="378" text-anchor="middle" fill="#8aa0ad" font-size="15">I = 4 A</text>
  <path d="M210 300 H 380" stroke="#f2c56b" stroke-width="5"/>
  <text class="num" x="300" y="285" fill="#8aa0ad" font-size="15">导线 0.1Ω</text>
  <rect x="380" y="270" width="110" height="60" rx="8" fill="#3a2a1a" stroke="#f2c56b" stroke-width="2"/>
  <text class="zh" x="435" y="307" text-anchor="middle" fill="#f2c56b" font-size="18">接点</text>
  <path d="M490 300 H 700" stroke="#f2c56b" stroke-width="5"/>
  <rect x="700" y="250" width="140" height="110" rx="10" fill="#0e1d27" stroke="#2a4a5e"/>
  <text class="zh" x="770" y="300" text-anchor="middle" fill="#e8eef2" font-size="18">远端灯</text>
  <text class="num" x="770" y="332" text-anchor="middle" fill="#6fe3c8" font-size="20">23.1 V</text>
  <path d="M770 360 V 470 H 135 V 430" fill="none" stroke="#f2c56b" stroke-width="4"/>
  <text class="num" x="470" y="520" text-anchor="middle" fill="#ff7a6b" font-size="26">压降 0.9V → 接点电阻 0.225Ω</text>
  <text class="zh" x="470" y="556" text-anchor="middle" fill="#8aa0ad" font-size="17">0.9V ÷ 4A = 0.225Ω，明显大于健康接点；接触面氧化/松动会让压降越来越大。</text>
  <g style="animation:pulse 2s infinite"><rect x="380" y="270" width="110" height="60" rx="8" fill="none" stroke="#ff7a6b" stroke-width="3"/></g>
  </g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">灯不亮不一定是灯坏了；沿着路量下去，压降会把“坏接点”指出来。</text>
</svg>
