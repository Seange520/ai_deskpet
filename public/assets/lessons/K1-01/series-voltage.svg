<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="串联分压：电压按电阻分蛋糕">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K1-01</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">串联分压：电压按电阻分蛋糕</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>
<g>
  <rect x="80" y="300" width="180" height="190" rx="10" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="170" y="342" text-anchor="middle" fill="#6fe3c8" font-size="20">5V 电源</text>
  <text class="num" x="170" y="392" text-anchor="middle" fill="#e8eef2" font-size="30">5.02 V</text>
  <text class="num" x="170" y="426" text-anchor="middle" fill="#8aa0ad" font-size="15">USB 5V</text>
  <path d="M260 340 H 400" stroke="#f2c56b" stroke-width="4"/>
  <rect x="400" y="300" width="150" height="80" rx="8" fill="#0e1d27" stroke="#2a4a5e" stroke-width="2"/>
  <text class="zh" x="475" y="350" text-anchor="middle" fill="#e8eef2" font-size="24">220Ω</text>
  <path d="M550 340 H 620" stroke="#f2c56b" stroke-width="4"/>
  <polygon points="620,300 620,380 690,340" fill="#1a3340" stroke="#6fe3c8" stroke-width="3"/>
  <path d="M690 340 H 760 V 500 H 80 V 480" fill="none" stroke="#f2c56b" stroke-width="4"/>
  <text class="zh" x="475" y="262" text-anchor="middle" fill="#f2c56b" font-size="19">电阻上分到 3.1V</text>
  <line x1="475" y1="272" x2="475" y2="300" stroke="#f2c56b" stroke-dasharray="4 4"/>
  <text class="zh" x="655" y="262" text-anchor="middle" fill="#6fe3c8" font-size="19">LED 分到 1.92V</text>
  <line x1="655" y1="272" x2="655" y2="300" stroke="#6fe3c8" stroke-dasharray="4 4"/>
  <text class="num" x="475" y="560" fill="#e8eef2" font-size="22">I ≈ 14 mA（串联各处相等）</text>
  <text class="num" x="475" y="596" fill="#8aa0ad" font-size="18">U = I × R = 14mA × 220Ω ≈ 3.1V</text>
  <g style="animation:flow 1.2s linear infinite"><path d="M270 330 H 390 M560 330 H 610 M700 330 H 750" stroke="#6fe3c8" stroke-width="3" stroke-dasharray="10 14"/></g>
  </g>
<text class="zh" x="56" y="645" fill="#8aa0ad" font-size="16">电流处处相等；电压按电阻大小分配。电阻大的那段，分走更多电压。</text>
</svg>
