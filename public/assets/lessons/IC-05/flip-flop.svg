<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="IC-05 触发器：置位、复位、时钟沿锁存">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#12262b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="#08161a"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <text x="48" y="64" fill="#4fd1c5" font-family="Consolas, monospace" font-size="17" letter-spacing="2">THE FORGE / 检修手册 · IC-05</text>
  <text x="48" y="108" fill="#e6f7f5" font-family="Microsoft YaHei, sans-serif" font-size="38" font-weight="700">触发器：把状态记住</text>
  <line x1="48" y1="128" x2="1152" y2="128" stroke="#1d3a40" stroke-width="2"/>

  <g font-family="Microsoft YaHei, sans-serif">
    <rect x="48" y="168" width="520" height="300" rx="12" fill="#0d2328" stroke="#2b5b63"/>
    <text x="72" y="206" fill="#8fe3d8" font-size="20">① SR 锁存器：两句话锁住状态</text>
    <rect x="72" y="228" width="472" height="58" rx="8" fill="#12302a" stroke="#4fd1c5"/>
    <text x="88" y="252" fill="#e6f7f5" font-size="16">置位 S=1 → Q=1（之后松开也不掉）</text>
    <text x="88" y="274" fill="#9fb8bd" font-size="13">例：按下启动按钮，设备保持运行。</text>
    <rect x="72" y="296" width="472" height="58" rx="8" fill="#1a2a33" stroke="#2b5b63"/>
    <text x="88" y="320" fill="#e6f7f5" font-size="16">复位 R=1 → Q=0（清回初始态）</text>
    <text x="88" y="342" fill="#9fb8bd" font-size="13">例：按下停止/急停，状态被清掉。</text>
    <text x="72" y="392" fill="#f6c177" font-size="16">SR 同时为 1：非法，输出不确定。</text>
    <text x="72" y="426" fill="#6f8f99" font-size="14">这就是「状态」：输出记住最近一次操作。</text>

    <rect x="616" y="168" width="536" height="300" rx="12" fill="#0d2328" stroke="#2b5b63"/>
    <text x="640" y="206" fill="#8fe3d8" font-size="20">② D 触发器：只在时钟沿收数</text>
    <text x="640" y="242" fill="#d7ece9" font-family="Consolas, monospace" font-size="16">CLK:  0 → 1（上升沿）</text>
    <text x="640" y="276" fill="#d7ece9" font-family="Consolas, monospace" font-size="16">D:    ? → 1</text>
    <text x="640" y="310" fill="#8fe3d8" font-family="Consolas, monospace" font-size="16">Q:    沿到来时锁住 D=1</text>
    <text x="640" y="352" fill="#f6c177" font-size="16">之后 D 再变，Q 要等下一个沿。</text>
    <text x="640" y="386" fill="#6f8f99" font-size="14">时钟让整个电路按同一个节拍前进。</text>
    <text x="640" y="420" fill="#9fb8bd" font-size="14">CPU 的寄存器，就是一组这样的 D 触发器。</text>

    <rect x="48" y="500" width="1104" height="104" rx="12" fill="#12262b" stroke="#2b5b63"/>
    <text x="72" y="534" fill="#8fe3d8" font-size="19">③ 验收要点</text>
    <text x="72" y="566" fill="#e6f7f5" font-family="Consolas, monospace" font-size="17">置位→Q=3.3V；复位→Q=0V；时钟沿→Q 跟随 D；SR 不可同时为 1</text>
    <text x="72" y="592" fill="#9fb8bd" font-size="14">组合逻辑 + 状态记忆 = 时序电路；先按时序表推演，再上电逐拍测。</text>

    <text x="48" y="648" fill="#6f8f99" font-size="13">教学示意：触发器输入不可悬空；实测先断电、核对电源与地，再打时钟沿逐拍验收。</text>
  </g>
</svg>
