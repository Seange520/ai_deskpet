<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="分断瞬间：电流断，电压冲">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K6-01 · 波形</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">分断瞬间：电流断，电压冲</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="1088" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <line x1="120" y1="470" x2="1080" y2="470" stroke="#8aa0ad" stroke-width="2"/>
<line x1="120" y1="470" x2="120" y2="230" stroke="#8aa0ad" stroke-width="2"/>
<text class="zh" x="1070" y="496" fill="#8aa0ad" font-size="15" text-anchor="end">时间</text>
<text class="zh" x="110" y="244" fill="#8aa0ad" font-size="15" text-anchor="end">电压/电流</text>
  <path d="M140 430 L200 430 L200 300 L260 300 L260 430 L320 430 L320 240 L340 240 L360 430 L420 430 L420 300 L480 300 L480 430 L540 430 L540 240 L560 240 L580 430 L640 430 L640 300 L700 300 L700 430 L760 430" fill="none" stroke="#6fe3c8" stroke-width="3"/>
  <line x1="120" y1="290" x2="1080" y2="290" stroke="#f2c56b" stroke-width="2" stroke-dasharray="8 6"/>
  <text class="zh" x="1000" y="282" fill="#f2c56b" font-size="15" text-anchor="end">钳位后 24.7V</text>
  <line x1="120" y1="210" x2="1080" y2="210" stroke="#ff7a6b" stroke-width="2" stroke-dasharray="8 6"/>
  <text class="zh" x="1000" y="202" fill="#ff7a6b" font-size="15" text-anchor="end">无钳位峰值 264V</text>
  <text class="zh" x="86" y="530" fill="#e8eef2" font-size="17">电压尖峰被二极管钳在电源轨附近；没有钳位就冲进控制器。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学仿真：波形为等效包络示意；示波器实测需隔离与合适量程。</text>
</svg>
