<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="线圈断电：反峰从哪来，往哪泄">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K6-01</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">线圈断电：反峰从哪来，往哪泄</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="1088" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <g><rect x="90" y="280" width="180" height="90" rx="8" fill="#0e1d27" stroke="#f2c56b" stroke-width="2"/>
<text class="zh" x="180" y="314" text-anchor="middle" fill="#f2c56b" font-size="19">24V 电源</text>
<text class="zh" x="180" y="342" text-anchor="middle" fill="#8aa0ad" font-size="15">SELV</text></g>
  <g><rect x="330" y="260" width="200" height="130" rx="8" fill="#0e1d27" stroke="#6fe3c8" stroke-width="2"/>
<text class="zh" x="430" y="294" text-anchor="middle" fill="#6fe3c8" font-size="19">开关 K1</text>
<text class="zh" x="430" y="322" text-anchor="middle" fill="#8aa0ad" font-size="15">MOSFET/继电器</text></g>
  <g><rect x="600" y="260" width="200" height="130" rx="8" fill="#0e1d27" stroke="#6fe3c8" stroke-width="2"/>
<text class="zh" x="700" y="294" text-anchor="middle" fill="#6fe3c8" font-size="19">线圈 M2</text>
<text class="zh" x="700" y="322" text-anchor="middle" fill="#8aa0ad" font-size="15">L = 0.12H</text></g>
  <g><rect x="860" y="250" width="160" height="80" rx="8" fill="#0e1d27" stroke="#6fe3c8" stroke-width="2"/>
<text class="zh" x="940" y="284" text-anchor="middle" fill="#6fe3c8" font-size="19">续流二极管</text>
<text class="zh" x="940" y="312" text-anchor="middle" fill="#8aa0ad" font-size="15">阴极接 +24V</text></g>
  <g><rect x="860" y="370" width="160" height="80" rx="8" fill="#0e1d27" stroke="#8aa0ad" stroke-width="2"/>
<text class="zh" x="940" y="404" text-anchor="middle" fill="#8aa0ad" font-size="19">RC 吸收</text>
<text class="zh" x="940" y="432" text-anchor="middle" fill="#8aa0ad" font-size="15">10Ω + 470µF</text></g>
  <line x1="270" y1="325" x2="330" y2="325" stroke="#f2c56b" stroke-width="3"/>
  <line x1="530" y1="325" x2="600" y2="325" stroke="#6fe3c8" stroke-width="3"/>
  <line x1="800" y1="325" x2="860" y2="290" stroke="#6fe3c8" stroke-width="3"/>
  <line x1="800" y1="325" x2="860" y2="410" stroke="#8aa0ad" stroke-width="3"/>
  <text class="zh" x="90" y="530" fill="#8aa0ad" font-size="16">不钳位：峰值约 264V，控制器见 6.4V 波动→复位；二极管钳位后约 24.7V。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学示例：参数来自 M1 冷库模型；真实线圈峰值取决于电感、电流与分断速度。</text>
</svg>
