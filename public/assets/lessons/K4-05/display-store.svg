<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="先画对，再存对">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes sweep{0%{transform:translateX(0)}100%{transform:translateX(640px)}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE WEAVE / 检修手册 · K4-05 · 显示与存储</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">先画对，再存对</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="1088" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="86" y="204" fill="#6fe3c8" font-size="17">四步流程</text>
  
    <rect x="90" y="260" width="240" height="180" rx="10" fill="#0e1d27" stroke="#2a4a5e"/>
    <text class="zh" x="210" y="312" text-anchor="middle" fill="#6fe3c8" font-size="22">① 画</text>
    <text class="zh" x="210" y="356" text-anchor="middle" fill="#e8eef2" font-size="16">清屏 → 定位 → 写字/画图</text>
    <rect x="360" y="260" width="240" height="180" rx="10" fill="#0e1d27" stroke="#2a4a5e"/>
    <text class="zh" x="480" y="312" text-anchor="middle" fill="#6fe3c8" font-size="22">② 显</text>
    <text class="zh" x="480" y="356" text-anchor="middle" fill="#e8eef2" font-size="16">刷到屏幕，看到结果</text>
    <rect x="630" y="260" width="240" height="180" rx="10" fill="#0e1d27" stroke="#2a4a5e"/>
    <text class="zh" x="750" y="312" text-anchor="middle" fill="#6fe3c8" font-size="22">③ 存</text>
    <text class="zh" x="750" y="356" text-anchor="middle" fill="#e8eef2" font-size="16">把关键值写入 EEPROM/Flash</text>
    <rect x="900" y="260" width="240" height="180" rx="10" fill="#0e1d27" stroke="#2a4a5e"/>
    <text class="zh" x="1020" y="312" text-anchor="middle" fill="#6fe3c8" font-size="22">④ 验</text>
    <text class="zh" x="1020" y="356" text-anchor="middle" fill="#e8eef2" font-size="16">重启后读回，确认一致</text>
  <text class="zh" x="86" y="520" fill="#8aa0ad" font-size="16">刷新后能恢复 = 存对了；刷新后画面在但状态丢 = 只存了显示，没存状态。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学示例：真实项目还需考虑写入寿命、掉电保护与数据校验。</text>
</svg>
