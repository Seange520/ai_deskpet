<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="长脚正极，电阻限流">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K0-03 · LED 接法</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">长脚正极，电阻限流</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="1088" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <g><rect x="110" y="270" width="160" height="90" rx="8" fill="#0e1d27" stroke="#f2c56b" stroke-width="2"/>
<text class="zh" x="190" y="304" text-anchor="middle" fill="#f2c56b" font-size="19">5V 电源</text>
<text class="zh" x="190" y="332" text-anchor="middle" fill="#8aa0ad" font-size="15">USB 5V</text></g>
  <g><rect x="360" y="250" width="200" height="130" rx="8" fill="#0e1d27" stroke="#6fe3c8" stroke-width="2"/>
<text class="zh" x="460" y="284" text-anchor="middle" fill="#6fe3c8" font-size="19">220Ω</text>
<text class="zh" x="460" y="312" text-anchor="middle" fill="#8aa0ad" font-size="15">棕黑棕金</text></g>
  <g><rect x="650" y="250" width="220" height="130" rx="8" fill="#0e1d27" stroke="#6fe3c8" stroke-width="2"/>
<text class="zh" x="760" y="284" text-anchor="middle" fill="#6fe3c8" font-size="19">LED</text>
<text class="zh" x="760" y="312" text-anchor="middle" fill="#8aa0ad" font-size="15">长脚→电阻侧</text></g>
  <line x1="270" y1="315" x2="360" y2="315" stroke="#f2c56b" stroke-width="3"/>
  <line x1="560" y1="315" x2="650" y2="315" stroke="#f2c56b" stroke-width="3"/>
  <line x1="870" y1="315" x2="1050" y2="315" stroke="#8aa0ad" stroke-width="3"/>
  <line x1="1050" y1="315" x2="1050" y2="470" stroke="#8aa0ad" stroke-width="3"/>
  <line x1="1050" y1="470" x2="190" y2="470" stroke="#8aa0ad" stroke-width="3"/>
  <line x1="190" y1="470" x2="190" y2="360" stroke="#8aa0ad" stroke-width="3"/>
  <text class="num" x="420" y="430" fill="#f2c56b" font-size="19">I ≈ 14mA</text>
  <text class="zh" x="620" y="430" fill="#8aa0ad" font-size="16">U ≈ 3.1V + 1.9V = 5V</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学示例：LED 必须串限流电阻；极性反接不亮，直连电源可能损坏。</text>
</svg>
