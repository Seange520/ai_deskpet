<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="GPIO：一根引脚，两种角色">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes heat{0%,100%{fill:#f2c56b}50%{fill:#ff7a6b}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K3-02</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">GPIO：一根引脚，两种角色</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g><rect x="56" y="170" width="500" height="200" rx="10" fill="#12242f" stroke="#2a4a5e"/>
<text class="zh" x="76" y="200" fill="#6fe3c8" font-size="17">输出模式（OUTPUT）</text><text class="zh" x="76" y="224" fill="#e8eef2" font-size="18">引脚自己决定电压</text><text class="zh" x="76" y="256" fill="#e8eef2" font-size="18">写 HIGH → 3.3V</text><text class="zh" x="76" y="288" fill="#e8eef2" font-size="18">写 LOW → 0V</text><text class="zh" x="76" y="320" fill="#e8eef2" font-size="18">用来点灯、驱动蜂鸣器</text></g>
<g><rect x="56" y="390" width="500" height="200" rx="10" fill="#12242f" stroke="#2a4a5e"/>
<text class="zh" x="76" y="420" fill="#6fe3c8" font-size="17">输入模式（INPUT）</text><text class="zh" x="76" y="444" fill="#e8eef2" font-size="18">引脚去读外部电平</text><text class="zh" x="76" y="476" fill="#e8eef2" font-size="18">按钮按下 → 0V</text><text class="zh" x="76" y="508" fill="#e8eef2" font-size="18">按钮松开 → 3.3V（上拉）</text><text class="zh" x="76" y="540" fill="#e8eef2" font-size="18">用来读按钮、传感器</text></g>
<g>
  <rect x="620" y="170" width="524" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="646" y="204" fill="#6fe3c8" font-size="17">切换角色前先断电</text>
  <rect x="646" y="232" width="210" height="150" rx="10" fill="#0e1d27" stroke="#6fe3c8" stroke-width="2"/>
  <text class="zh" x="751" y="280" text-anchor="middle" fill="#6fe3c8" font-size="19">OUTPUT</text>
  <text class="zh" x="751" y="320" text-anchor="middle" fill="#e8eef2" font-size="15">写电平 → 灯亮/灭</text>
  <rect x="900" y="232" width="210" height="150" rx="10" fill="#0e1d27" stroke="#f2c56b" stroke-width="2"/>
  <text class="zh" x="1005" y="280" text-anchor="middle" fill="#f2c56b" font-size="19">INPUT</text>
  <text class="zh" x="1005" y="320" text-anchor="middle" fill="#e8eef2" font-size="15">读电平 → 判断按钮</text>
  <text class="zh" x="646" y="440" fill="#e8eef2" font-size="17">输出接输出 = 两股电打架（可能烧引脚）</text>
  <text class="zh" x="646" y="476" fill="#e8eef2" font-size="17">输入悬空 = 电平未知，要上拉/下拉</text>
  <text class="zh" x="646" y="512" fill="#8aa0ad" font-size="16">配置错了，现象往往像“器件坏了”。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学示例：具体引脚与驱动能力以开发板数据手册为准。</text>
</svg>
