<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="输入怎么控制输出：一条判断链">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes heat{0%,100%{fill:#f2c56b}50%{fill:#ff7a6b}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K3-02 · 按钮点灯</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">输入怎么控制输出：一条判断链</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="520" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="82" y="204" fill="#6fe3c8" font-size="17">链路</text>
  
    <rect x="82" y="232" width="470" height="66" rx="8" fill="#0e1d27" stroke="#2a4a5e"/>
    <text class="zh" x="108" y="274" fill="#e8eef2" font-size="18">按钮/传感器 → 引脚电平</text>
    <rect x="82" y="314" width="470" height="66" rx="8" fill="#0e1d27" stroke="#2a4a5e"/>
    <text class="zh" x="108" y="356" fill="#e8eef2" font-size="18">读引脚 → 得到 0 或 1</text>
    <rect x="82" y="396" width="470" height="66" rx="8" fill="#0e1d27" stroke="#2a4a5e"/>
    <text class="zh" x="108" y="438" fill="#e8eef2" font-size="18">判断 → 决定输出动作</text>
    <rect x="82" y="478" width="470" height="66" rx="8" fill="#0e1d27" stroke="#2a4a5e"/>
    <text class="zh" x="108" y="520" fill="#e8eef2" font-size="18">写引脚 → 灯亮或灭</text>
</g>
<g>
  <rect x="620" y="170" width="530" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="646" y="204" fill="#6fe3c8" font-size="17">伪代码</text>
  <text class="num" x="646" y="252" fill="#e8eef2" font-size="16">pinMode(BTN, INPUT);</text>
  <text class="num" x="646" y="286" fill="#e8eef2" font-size="16">pinMode(LED, OUTPUT);</text>
  <text class="num" x="646" y="320" fill="#e8eef2" font-size="16">if (digitalRead(BTN) == 0) {</text>
  <text class="num" x="672" y="354" fill="#e8eef2" font-size="16">digitalWrite(LED, HIGH);</text>
  <text class="num" x="646" y="388" fill="#e8eef2" font-size="16">} else {</text>
  <text class="num" x="672" y="422" fill="#e8eef2" font-size="16">digitalWrite(LED, LOW);</text>
  <text class="num" x="646" y="456" fill="#e8eef2" font-size="16">}</text>
  <text class="zh" x="646" y="512" fill="#8aa0ad" font-size="16">先读再写：不要让输出与输入抢同一根脚。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">代码为教学伪代码；真实工程还要考虑消抖、限流与安全。</text>
</svg>
