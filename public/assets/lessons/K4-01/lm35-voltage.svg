<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="LM35：10mV 代表 1°C">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes sweep{0%{transform:translateX(0)}100%{transform:translateX(640px)}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE WEAVE / 检修手册 · K4-01 · 动画</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">LM35：10mV 代表 1°C</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="520" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="82" y="204" fill="#6fe3c8" font-size="17">读数换算</text>
  <rect x="82" y="240" width="460" height="110" rx="8" fill="#162b2f" stroke="#6fe3c8" stroke-width="2"/>
  <text class="num" x="312" y="312" text-anchor="middle" fill="#6fe3c8" font-size="42">0.25 V</text>
  <text class="zh" x="82" y="400" fill="#e8eef2" font-size="18">0.25V ÷ 0.01V/°C = 25°C</text>
  <text class="zh" x="82" y="440" fill="#e8eef2" font-size="18">ADC 读数 2048 ≈ 1.65V ≈ 165°C（示例）</text>
  <text class="zh" x="82" y="500" fill="#8aa0ad" font-size="16">先量电压，再换算；不要跳过测量直接猜温度。</text>
</g>
<g>
  <rect x="620" y="170" width="524" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <line x1="670" y1="510" x2="1090" y2="510" stroke="#8aa0ad" stroke-width="2"/>
<line x1="670" y1="510" x2="670" y2="210" stroke="#8aa0ad" stroke-width="2"/>
<text class="zh" x="1080" y="536" fill="#8aa0ad" font-size="15" text-anchor="end">温度 °C</text>
<text class="zh" x="660" y="224" fill="#8aa0ad" font-size="15" text-anchor="end">电压 V</text>
  <path d="M670 470 L1090 250" fill="none" stroke="#f2c56b" stroke-width="3"/>
  <circle cx="806" cy="345" r="8" fill="#f2c56b"/>
  <text class="zh" x="820" y="338" fill="#e8eef2" font-size="16">25°C → 0.25V</text>
  <text class="zh" x="700" y="540" fill="#8aa0ad" font-size="16">线性关系：每升 1°C，电压升 10mV。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">动画资产：教学模型为线性近似，真实器件有误差与自热。</text>
</svg>
