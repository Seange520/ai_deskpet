<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="传感器：数字报开关，模拟报程度">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes sweep{0%{transform:translateX(0)}100%{transform:translateX(640px)}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE WEAVE / 检修手册 · K4-01</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">传感器：数字报开关，模拟报程度</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g><rect x="56" y="170" width="500" height="200" rx="10" fill="#12242f" stroke="#6fe3c8"/>
<text class="zh" x="76" y="200" fill="#6fe3c8" font-size="17">数字传感器</text><text class="zh" x="76" y="224" fill="#e8eef2" font-size="18">只输出 0 / 1（阈值内建）</text><text class="zh" x="76" y="256" fill="#e8eef2" font-size="18">例如：按钮、光电开关、限位</text><text class="zh" x="76" y="288" fill="#e8eef2" font-size="18">接线简单，抗干扰好</text><text class="zh" x="76" y="320" fill="#e8eef2" font-size="18">但你知道的信息少：只有“有/无”</text></g>
<g><rect x="56" y="390" width="500" height="200" rx="10" fill="#12242f" stroke="#f2c56b"/>
<text class="zh" x="76" y="420" fill="#6fe3c8" font-size="17">模拟传感器</text><text class="zh" x="76" y="444" fill="#e8eef2" font-size="18">输出连续电压（经 ADC 读）</text><text class="zh" x="76" y="476" fill="#e8eef2" font-size="18">例如：LM35、电位器、光敏电阻</text><text class="zh" x="76" y="508" fill="#e8eef2" font-size="18">信息多，但需要阈值与标定</text><text class="zh" x="76" y="540" fill="#e8eef2" font-size="18">噪声、参考电压都会影响读数</text></g>
<g>
  <rect x="600" y="170" width="544" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="626" y="204" fill="#6fe3c8" font-size="17">选型先问三个问题</text>
  <text class="zh" x="626" y="252" fill="#e8eef2" font-size="18">① 我要“有/无”，还是要“多少”？</text>
  <text class="zh" x="626" y="292" fill="#e8eef2" font-size="18">② 供电与信号电平匹配吗？</text>
  <text class="zh" x="626" y="332" fill="#e8eef2" font-size="18">③ 需要标定/滤波/温补吗？</text>
  <text class="zh" x="626" y="400" fill="#8aa0ad" font-size="16">数字省事，模拟信息多；先明确用途。</text>
  <text class="zh" x="626" y="470" fill="#f2c56b" font-size="16">接传感器前先看数据手册的电压范围。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学示例：具体器件参数以数据手册为准，本图为概念对照。</text>
</svg>
