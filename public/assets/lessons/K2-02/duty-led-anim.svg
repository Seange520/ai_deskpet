<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="占空比变了，灯为什么还亮着？">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes heat{0%,100%{fill:#f2c56b}50%{fill:#ff7a6b}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K2-02 · 动画</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">占空比变了，灯为什么还亮着？</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g><rect x="56" y="170" width="470" height="420" rx="10" fill="#12242f" stroke="#2a4a5e"/>
<text class="zh" x="76" y="200" fill="#6fe3c8" font-size="17">人眼是低通滤波器</text><text class="zh" x="76" y="224" fill="#e8eef2" font-size="18">PWM 频率足够高时（如 1kHz）</text><text class="zh" x="76" y="256" fill="#e8eef2" font-size="18">人眼看不到通断</text><text class="zh" x="76" y="288" fill="#e8eef2" font-size="18">只感觉到平均亮度</text><text class="zh" x="76" y="320" fill="#e8eef2" font-size="18"></text><text class="zh" x="76" y="352" fill="#e8eef2" font-size="18">所以：</text><text class="zh" x="76" y="384" fill="#e8eef2" font-size="18">占空比 25% → 偏暗</text><text class="zh" x="76" y="416" fill="#e8eef2" font-size="18">占空比 50% → 一半亮</text><text class="zh" x="76" y="448" fill="#e8eef2" font-size="18">占空比 75% → 接近全亮</text></g>
<g>
  <rect x="570" y="170" width="580" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <g><text class="zh" x="600" y="270" fill="#e8eef2" font-size="18">25%</text>
    <path d="M700 290L700 240H775V290H1000" fill="none" stroke="#6fe3c8" stroke-width="3"/>
    <circle cx="1080" cy="265" r="22" fill="#f2c56b" opacity="0.3"/>
    <circle cx="1080" cy="265" r="22" fill="none" stroke="#f2c56b"/></g><g><text class="zh" x="600" y="380" fill="#e8eef2" font-size="18">50%</text>
    <path d="M700 400L700 350H850V400H1000" fill="none" stroke="#6fe3c8" stroke-width="3"/>
    <circle cx="1080" cy="375" r="22" fill="#f2c56b" opacity="0.55"/>
    <circle cx="1080" cy="375" r="22" fill="none" stroke="#f2c56b"/></g><g><text class="zh" x="600" y="490" fill="#e8eef2" font-size="18">75%</text>
    <path d="M700 510L700 460H925V510H1000" fill="none" stroke="#6fe3c8" stroke-width="3"/>
    <circle cx="1080" cy="485" r="22" fill="#f2c56b" opacity="0.9"/>
    <circle cx="1080" cy="485" r="22" fill="none" stroke="#f2c56b"/></g>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">动画资产：内嵌 CSS 动画，运行时无声音，可静音观看；含字幕文本。</text>
</svg>
