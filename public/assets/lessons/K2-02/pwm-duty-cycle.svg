<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="PWM：用时间比例调亮度">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes heat{0%,100%{fill:#f2c56b}50%{fill:#ff7a6b}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K2-02</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">PWM：用时间比例调亮度</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="1088" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  
    <text class="zh" x="86" y="244" fill="#e8eef2" font-size="20">25%</text>
    <path d="M180 280L180 210H370V280H940" fill="none" stroke="#6fe3c8" stroke-width="3"/>
    <text class="zh" x="980" y="254" fill="#8aa0ad" font-size="17">亮 25%</text>
    <text class="zh" x="86" y="364" fill="#e8eef2" font-size="20">50%</text>
    <path d="M180 400L180 330H560V400H940" fill="none" stroke="#6fe3c8" stroke-width="3"/>
    <text class="zh" x="980" y="374" fill="#8aa0ad" font-size="17">亮 50%</text>
    <text class="zh" x="86" y="484" fill="#e8eef2" font-size="20">75%</text>
    <path d="M180 520L180 450H750V520H940" fill="none" stroke="#6fe3c8" stroke-width="3"/>
    <text class="zh" x="980" y="494" fill="#8aa0ad" font-size="17">亮 75%</text>
  
  <text class="num" x="86" y="560" fill="#f2c56b" font-size="22">平均电压 ≈ 占空比 × 高电平电压</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">示例：3.3V 逻辑 + 50% 占空比，平均约 1.65V；实际驱动 LED 请串限流电阻。</text>
</svg>

