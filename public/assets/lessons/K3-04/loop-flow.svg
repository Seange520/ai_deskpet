<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="循环：让灯自己呼吸">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes sweep{0%{transform:translateX(0)}100%{transform:translateX(640px)}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K3-04</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">循环：让灯自己呼吸</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g><rect x="56" y="170" width="430" height="420" rx="10" fill="#12242f" stroke="#2a4a5e"/>
<text class="zh" x="76" y="200" fill="#6fe3c8" font-size="17">呼吸灯的三步循环</text><text class="zh" x="76" y="224" fill="#e8eef2" font-size="18">① 亮：写高电平</text><text class="zh" x="76" y="256" fill="#e8eef2" font-size="18">② 等：保持一段时间</text><text class="zh" x="76" y="288" fill="#e8eef2" font-size="18">③ 灭：写低电平</text><text class="zh" x="76" y="320" fill="#e8eef2" font-size="18">④ 等：再保持一段时间</text><text class="zh" x="76" y="352" fill="#e8eef2" font-size="18"></text><text class="zh" x="76" y="384" fill="#e8eef2" font-size="18">循环就是“重复做”，</text><text class="zh" x="76" y="416" fill="#e8eef2" font-size="18">条件就是“什么时候做别的”。</text></g>
<g>
  <rect x="530" y="170" width="614" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <g><rect x="580" y="210" width="220" height="90" rx="8" fill="#0e1d27" stroke="#6fe3c8" stroke-width="2"/>
<text class="zh" x="690" y="244" text-anchor="middle" fill="#6fe3c8" font-size="19">① 亮</text>
<text class="zh" x="690" y="272" text-anchor="middle" fill="#8aa0ad" font-size="15">写 HIGH</text></g><g><rect x="860" y="210" width="220" height="90" rx="8" fill="#0e1d27" stroke="#f2c56b" stroke-width="2"/>
<text class="zh" x="970" y="244" text-anchor="middle" fill="#f2c56b" font-size="19">② 等</text>
<text class="zh" x="970" y="272" text-anchor="middle" fill="#8aa0ad" font-size="15">delay(500)</text></g><g><rect x="580" y="360" width="220" height="90" rx="8" fill="#0e1d27" stroke="#6fe3c8" stroke-width="2"/>
<text class="zh" x="690" y="394" text-anchor="middle" fill="#6fe3c8" font-size="19">③ 灭</text>
<text class="zh" x="690" y="422" text-anchor="middle" fill="#8aa0ad" font-size="15">写 HIGH</text></g><g><rect x="860" y="360" width="220" height="90" rx="8" fill="#0e1d27" stroke="#f2c56b" stroke-width="2"/>
<text class="zh" x="970" y="394" text-anchor="middle" fill="#f2c56b" font-size="19">④ 等</text>
<text class="zh" x="970" y="422" text-anchor="middle" fill="#8aa0ad" font-size="15">delay(500)</text></g>
  <path d="M800 300 H860 V450 H800" fill="none" stroke="#6fe3c8" stroke-width="3" stroke-dasharray="8 6"/>
  <text class="zh" x="880" y="380" fill="#8aa0ad" font-size="16">回到 ①</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学示例：delay 会占用主循环，真实项目常用非阻塞定时。</text>
</svg>
