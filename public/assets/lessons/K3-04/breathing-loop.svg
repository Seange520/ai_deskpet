<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="一呼一吸：500 毫秒的节奏">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes sweep{0%{transform:translateX(0)}100%{transform:translateX(640px)}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K3-04 · 动画</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">一呼一吸：500 毫秒的节奏</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="1088" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="86" y="204" fill="#6fe3c8" font-size="17">亮灭时间线</text>
  <line x1="120" y1="420" x2="1100" y2="420" stroke="#8aa0ad" stroke-width="2"/>
  <rect x="150" y="330" width="120" height="90" rx="6" fill="#f2c56b" opacity="0.9"/>
    <text class="zh" x="210" y="385" text-anchor="middle" fill="#0b1620" font-size="17">亮</text>
    <text class="num" x="210" y="482" text-anchor="middle" fill="#8aa0ad" font-size="14">0ms</text><rect x="380" y="330" width="120" height="90" rx="6" fill="#f2c56b" opacity="0.25"/>
    <text class="zh" x="440" y="452" text-anchor="middle" fill="#8aa0ad" font-size="17">灭</text>
    <text class="num" x="440" y="482" text-anchor="middle" fill="#8aa0ad" font-size="14">500ms</text><rect x="610" y="330" width="120" height="90" rx="6" fill="#f2c56b" opacity="0.9"/>
    <text class="zh" x="670" y="385" text-anchor="middle" fill="#0b1620" font-size="17">亮</text>
    <text class="num" x="670" y="482" text-anchor="middle" fill="#8aa0ad" font-size="14">1000ms</text><rect x="840" y="330" width="120" height="90" rx="6" fill="#f2c56b" opacity="0.25"/>
    <text class="zh" x="900" y="452" text-anchor="middle" fill="#8aa0ad" font-size="17">灭</text>
    <text class="num" x="900" y="482" text-anchor="middle" fill="#8aa0ad" font-size="14">1500ms</text>
  <text class="zh" x="86" y="540" fill="#e8eef2" font-size="18">周期 = 亮 500ms + 灭 500ms = 1 秒 → 1Hz</text>
  <text class="zh" x="86" y="576" fill="#8aa0ad" font-size="16">把 500 改成 250，频率变 2Hz，灯闪得更快。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">动画资产：时间线为教学示意，实际时序受 CPU 与驱动影响。</text>
</svg>
