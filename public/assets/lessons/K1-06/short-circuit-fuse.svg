<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="短路到熔断：0.4 秒里发生了什么">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fe3c8" stop-opacity=".18"/><stop offset="1" stop-color="#12242f" stop-opacity="0"/></linearGradient>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes handmove{0%,100%{transform:translate(0,0)}50%{transform:translate(18px,-6px)}}
@keyframes heat{0%,100%{fill:#f2c56b}50%{fill:#ff7a6b}}
@keyframes spike{0%{stroke-dashoffset:900}100%{stroke-dashoffset:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K1-06 · 动画</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">短路到熔断：0.4 秒里发生了什么</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>
<g>
  <path d="M90 520 H 1110" stroke="#2a4a5e" stroke-width="2"/>
  <path d="M90 300 H 300 M300 300 V 520" fill="none" stroke="#2a4a5e" stroke-width="3"/>
  <polyline points="90,520 190,520 230,500 270,540 310,500 350,540 390,500 430,520 470,520 520,470 560,430 600,300 640,360 680,430 720,470 760,500 1110,520" fill="none" stroke="#6fe3c8" stroke-width="3" stroke-dasharray="900" style="animation:spike 2.4s ease-out infinite"/>
  <text class="num" x="210" y="280" fill="#8aa0ad" font-size="16">电流 →</text>
  <g style="animation:heat 1.2s ease-in-out infinite"><rect x="520" y="300" width="120" height="80" rx="8" fill="#f2c56b"/></g>
  <text class="zh" x="580" y="295" text-anchor="middle" fill="#f2c56b" font-size="16">保险丝发热</text>
  <g><rect x="700" y="470" width="360" height="90" rx="8" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="730" y="505" fill="#e8eef2" font-size="17">负载侧：灯保住，只损失一根保险丝</text>
  <text class="zh" x="730" y="535" fill="#8aa0ad" font-size="15">更换前必须断电，查清短路点，不要直接换大安数。</text></g>
  <text class="num" x="90" y="620" fill="#ff7a6b" font-size="20">I²t 达到阈值 → 熔断；型号必须与线路匹配</text>
  </g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">字幕：熔断是保护动作，不是故障本身；先找短路点，再换保险丝。</text>
</svg>
