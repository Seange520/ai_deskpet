<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="保险丝：额定电流要留裕量">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fe3c8" stop-opacity=".18"/><stop offset="1" stop-color="#12242f" stop-opacity="0"/></linearGradient>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes handmove{0%,100%{transform:translate(0,0)}50%{transform:translate(18px,-6px)}}
@keyframes heat{0%,100%{fill:#f2c56b}50%{fill:#ff7a6b}}
@keyframes spike{0%{stroke-dashoffset:900}100%{stroke-dashoffset:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K1-06</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">保险丝：额定电流要留裕量</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>
<g>
  <line x1="140" y1="330" x2="1060" y2="330" stroke="#2a4a5e" stroke-width="3"/>
  <g><line x1="140" y1="310" x2="140" y2="330" stroke="#2a4a5e" stroke-width="3"/><text class="num" x="140" y="292" text-anchor="middle" fill="#8aa0ad" font-size="16">0A</text></g><g><line x1="370" y1="310" x2="370" y2="330" stroke="#2a4a5e" stroke-width="3"/><text class="num" x="370" y="292" text-anchor="middle" fill="#8aa0ad" font-size="16">4A</text></g><g><line x1="600" y1="310" x2="600" y2="330" stroke="#2a4a5e" stroke-width="3"/><text class="num" x="600" y="292" text-anchor="middle" fill="#8aa0ad" font-size="16">8A</text></g><g><line x1="830" y1="310" x2="830" y2="330" stroke="#2a4a5e" stroke-width="3"/><text class="num" x="830" y="292" text-anchor="middle" fill="#8aa0ad" font-size="16">12A</text></g><g><line x1="1060" y1="310" x2="1060" y2="330" stroke="#2a4a5e" stroke-width="3"/><text class="num" x="1060" y="292" text-anchor="middle" fill="#8aa0ad" font-size="16">16A</text></g>
  <g><rect x="470" y="330" width="180" height="26" rx="4" fill="#6fe3c8" opacity=".25"/><text class="zh" x="560" y="400" text-anchor="middle" fill="#6fe3c8" font-size="18">工作电流 2A</text><line x1="560" y1="330" x2="560" y2="380" stroke="#6fe3c8" stroke-width="3"/></g>
  <g><rect x="580" y="330" width="260" height="26" rx="4" fill="#f2c56b" opacity=".35"/><text class="zh" x="710" y="430" text-anchor="middle" fill="#f2c56b" font-size="18">安全裕量区 1.2–2.0 倍</text></g>
  <g><rect x="700" y="330" width="250" height="26" rx="4" fill="#f2c56b"/><text class="zh" x="825" y="392" text-anchor="middle" fill="#0b1620" font-size="18" font-weight="700">3A</text></g>
  <g><rect x="910" y="330" width="150" height="26" rx="4" fill="#ff7a6b" opacity=".5"/><text class="zh" x="985" y="400" text-anchor="middle" fill="#ff7a6b" font-size="16">一启动就断</text></g>
  <g>
    <rect x="140" y="470" width="420" height="120" rx="10" fill="#12242f" stroke="#2a4a5e"/>
    <text class="zh" x="170" y="512" fill="#e8eef2" font-size="18">选型：额定 ≥ 1.2 × 工作，且 ≤ 2.0 × 工作</text>
    <text class="num" x="170" y="550" fill="#6fe3c8" font-size="19">In = 3A，Iw = 2A → 3/2 = 1.5 ✔</text>
    <text class="zh" x="170" y="580" fill="#8aa0ad" font-size="15">压缩机启动 6A：用慢熔或加软启动，别把快速熔断当故障。</text>
  </g>
  </g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">保险丝是替你烧的那根线：它先断，是为了别的都不烧。</text>
</svg>
