<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="断电—重连—补发—收到 ack">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE ECHO / 检修手册 · K5-04 · 状态机</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">断电—重连—补发—收到 ack</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="1088" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <g><rect x="90" y="260" width="180" height="90" rx="8" fill="#0e1d27" stroke="#8aa0ad" stroke-width="2"/>
<text class="zh" x="180" y="294" text-anchor="middle" fill="#8aa0ad" font-size="19">空闲</text>
<text class="zh" x="180" y="322" text-anchor="middle" fill="#8aa0ad" font-size="15">WiFi 断开</text></g>
  <g><rect x="320" y="260" width="180" height="90" rx="8" fill="#0e1d27" stroke="#f2c56b" stroke-width="2"/>
<text class="zh" x="410" y="294" text-anchor="middle" fill="#f2c56b" font-size="19">探测</text>
<text class="zh" x="410" y="322" text-anchor="middle" fill="#8aa0ad" font-size="15">每 5s 试连</text></g>
  <g><rect x="550" y="260" width="180" height="90" rx="8" fill="#0e1d27" stroke="#6fe3c8" stroke-width="2"/>
<text class="zh" x="640" y="294" text-anchor="middle" fill="#6fe3c8" font-size="19">退避</text>
<text class="zh" x="640" y="322" text-anchor="middle" fill="#8aa0ad" font-size="15">1s→2s→4s</text></g>
  <g><rect x="780" y="260" width="180" height="90" rx="8" fill="#0e1d27" stroke="#6fe3c8" stroke-width="2"/>
<text class="zh" x="870" y="294" text-anchor="middle" fill="#6fe3c8" font-size="19">连接</text>
<text class="zh" x="870" y="322" text-anchor="middle" fill="#8aa0ad" font-size="15">重订阅 topic</text></g>
  <g><rect x="1010" y="200" width="100" height="70" rx="8" fill="#0e1d27" stroke="#f2c56b" stroke-width="2"/>
<text class="zh" x="1060" y="234" text-anchor="middle" fill="#f2c56b" font-size="19">补发</text>
<text class="zh" x="1060" y="262" text-anchor="middle" fill="#8aa0ad" font-size="15">未 ack 队列</text></g>
  <g><rect x="1010" y="320" width="100" height="70" rx="8" fill="#0e1d27" stroke="#6fe3c8" stroke-width="2"/>
<text class="zh" x="1060" y="354" text-anchor="middle" fill="#6fe3c8" font-size="19">ack</text>
<text class="zh" x="1060" y="382" text-anchor="middle" fill="#8aa0ad" font-size="15">清理队列</text></g>
  
    <line x1="270" y1="305" x2="320" y2="305" stroke="#6fe3c8" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="500" y1="305" x2="550" y2="305" stroke="#6fe3c8" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="730" y1="305" x2="780" y2="305" stroke="#6fe3c8" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="960" y1="305" x2="1010" y2="305" stroke="#6fe3c8" stroke-width="3" stroke-dasharray="8 6"/>
  <text class="zh" x="86" y="470" fill="#e8eef2" font-size="18">断线时先停发、保留未确认队列；连上后按顺序补发，再恢复常态。</text>
  <text class="zh" x="86" y="510" fill="#8aa0ad" font-size="16">判断依据是“收到 ack”，不是“我发过了”。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">动画资产：静音可用；退避参数为教学默认，真实项目按业务调整。</text>
</svg>
