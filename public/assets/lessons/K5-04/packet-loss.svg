<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="丢一条就重来：重连、补发、去重">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE ECHO / 检修手册 · K5-04</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">丢一条就重来：重连、补发、去重</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g><rect x="56" y="170" width="470" height="420" rx="10" fill="#12242f" stroke="#2a4a5e"/>
<text class="zh" x="76" y="200" fill="#6fe3c8" font-size="17">20% 丢包下的五条报文</text><text class="zh" x="76" y="224" fill="#e8eef2" font-size="18">报文 1 → 发出 → ack ✓</text><text class="zh" x="76" y="256" fill="#e8eef2" font-size="18">报文 2 → 丢失 → 超时</text><text class="zh" x="76" y="288" fill="#e8eef2" font-size="18">报文 2 重发 → ack ✓（幂等去重）</text><text class="zh" x="76" y="320" fill="#e8eef2" font-size="18">报文 3 → 发出 → ack ✓</text><text class="zh" x="76" y="352" fill="#e8eef2" font-size="18">报文 4 → 延迟 → 重发 → 只处理一次</text><text class="zh" x="76" y="384" fill="#e8eef2" font-size="18"></text><text class="zh" x="76" y="416" fill="#e8eef2" font-size="18">关键：每条报文都有唯一 id，</text><text class="zh" x="76" y="448" fill="#e8eef2" font-size="18">重发不会造成重复执行。</text></g>
<g>
  <rect x="570" y="170" width="574" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="596" y="204" fill="#6fe3c8" font-size="17">退避序列（重试间隔翻倍）</text>
  
    <text class="zh" x="640" y="268" fill="#e8eef2" font-size="18">第 1 次</text>
    <text class="num" x="900" y="268" fill="#f2c56b" font-size="20">1s</text>
    <text class="zh" x="640" y="324" fill="#e8eef2" font-size="18">第 2 次</text>
    <text class="num" x="900" y="324" fill="#f2c56b" font-size="20">2s</text>
    <text class="zh" x="640" y="380" fill="#e8eef2" font-size="18">第 3 次</text>
    <text class="num" x="900" y="380" fill="#f2c56b" font-size="20">4s</text>
    <text class="zh" x="640" y="436" fill="#e8eef2" font-size="18">上限</text>
    <text class="num" x="900" y="436" fill="#f2c56b" font-size="20">30s</text>
  <text class="zh" x="596" y="520" fill="#8aa0ad" font-size="16">先判断“是否真的断了”，再决定重试；不要盲目刷请求。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学仿真：丢包率为教学设定；真实网络还需考虑拥塞与信号质量。</text>
</svg>
