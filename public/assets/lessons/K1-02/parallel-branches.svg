<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="并联分流：各走各的路，总电流相加">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fe3c8" stop-opacity=".18"/><stop offset="1" stop-color="#12242f" stop-opacity="0"/></linearGradient>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes handmove{0%,100%{transform:translate(0,0)}50%{transform:translate(18px,-6px)}}
@keyframes heat{0%,100%{fill:#f2c56b}50%{fill:#ff7a6b}}
@keyframes spike{0%{stroke-dashoffset:900}100%{stroke-dashoffset:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K1-02</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">并联分流：各走各的路，总电流相加</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>
<g>
  <rect x="70" y="250" width="150" height="180" rx="10" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="145" y="300" text-anchor="middle" fill="#6fe3c8" font-size="20">24V 电源</text>
  <text class="num" x="145" y="340" text-anchor="middle" fill="#e8eef2" font-size="26">24.0 V</text>
  <path d="M220 320 H 320 M320 320 V 230 H 620 M320 320 V 440 H 620" fill="none" stroke="#f2c56b" stroke-width="4"/>
  <rect x="620" y="205" width="120" height="50" rx="8" fill="#0e1d27" stroke="#2a4a5e"/><text class="zh" x="680" y="237" text-anchor="middle" fill="#e8eef2" font-size="17">12Ω</text>
  <rect x="620" y="415" width="120" height="50" rx="8" fill="#0e1d27" stroke="#2a4a5e"/><text class="zh" x="680" y="447" text-anchor="middle" fill="#e8eef2" font-size="17">24Ω</text>
  <text class="num" x="820" y="240" fill="#6fe3c8" font-size="20">2 A</text>
  <text class="num" x="820" y="450" fill="#6fe3c8" font-size="20">1 A</text>
  <path d="M740 230 H 900 M740 440 H 900 M900 230 V 440 M900 335 H 980" fill="none" stroke="#f2c56b" stroke-width="4"/>
  <text class="num" x="1020" y="320" fill="#e8eef2" font-size="24">3 A</text>
  <text class="zh" x="1020" y="350" fill="#8aa0ad" font-size="15">总电流</text>
  <g style="animation:flow 1.6s linear infinite"><path d="M240 300 H 310 M340 250 V 210 H 600 M340 300 V 460 H 600" fill="none" stroke="#6fe3c8" stroke-width="3" stroke-dasharray="8 16"/></g>
  <text class="zh" x="520" y="540" fill="#8aa0ad" font-size="17">并联：电压相同，电流按电阻反比分配；一条支路断了，另一条照常工作。</text>
  </g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">两条支路互不牵连——这正是“并联比串联更适合照明”的原因。</text>
</svg>
