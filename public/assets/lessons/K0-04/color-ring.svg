<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="四色环：棕黑红金 = 1000Ω ±5%">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K0-04 · 色环</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">四色环：棕黑红金 = 1000Ω ±5%</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="1088" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <rect x="180" y="330" width="700" height="80" rx="40" fill="#d8b98c" stroke="#2a4a5e"/>
  <line x1="120" y1="370" x2="180" y2="370" stroke="#8aa0ad" stroke-width="3"/>
  <line x1="880" y1="370" x2="940" y2="370" stroke="#8aa0ad" stroke-width="3"/>
  <rect x="250" y="330" width="26" height="80" fill="#7a4a1f"/><rect x="300" y="330" width="26" height="80" fill="#111"/><rect x="350" y="330" width="26" height="80" fill="#c0392b"/><rect x="400" y="330" width="26" height="80" fill="#c9a227"/>
  
    <text class="zh" x="240" y="470" fill="#e8eef2" font-size="16" text-anchor="middle">棕 </text>
    <text class="num" x="240" y="500" fill="#8aa0ad" font-size="14" text-anchor="middle"> 1</text>
    <text class="zh" x="290" y="470" fill="#e8eef2" font-size="16" text-anchor="middle">黑 </text>
    <text class="num" x="290" y="500" fill="#8aa0ad" font-size="14" text-anchor="middle"> 0</text>
    <text class="zh" x="340" y="470" fill="#e8eef2" font-size="16" text-anchor="middle">红 </text>
    <text class="num" x="340" y="500" fill="#8aa0ad" font-size="14" text-anchor="middle"> ×100</text>
    <text class="zh" x="390" y="470" fill="#e8eef2" font-size="16" text-anchor="middle">金 </text>
    <text class="num" x="390" y="500" fill="#8aa0ad" font-size="14" text-anchor="middle"> ±5%</text>
  <text class="zh" x="180" y="560" fill="#e8eef2" font-size="18">10 × 100 = 1000Ω = 1kΩ（±5%）</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学示例：色环读数以万用表实测为准；金/银色只用于误差环。</text>
</svg>
