<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="单位前缀：差一千倍，不是差一点">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K0-04</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">单位前缀：差一千倍，不是差一点</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g><rect x="56" y="170" width="470" height="420" rx="10" fill="#12242f" stroke="#2a4a5e"/>
<text class="zh" x="76" y="200" fill="#6fe3c8" font-size="17">常用单位换算</text><text class="zh" x="76" y="224" fill="#e8eef2" font-size="18">1 V = 1000 mV</text><text class="zh" x="76" y="256" fill="#e8eef2" font-size="18">1 A = 1000 mA</text><text class="zh" x="76" y="288" fill="#e8eef2" font-size="18">1 Ω = 1000 mΩ（常见于接触电阻）</text><text class="zh" x="76" y="320" fill="#e8eef2" font-size="18">1 kΩ = 1000 Ω</text><text class="zh" x="76" y="352" fill="#e8eef2" font-size="18"></text><text class="zh" x="76" y="384" fill="#e8eef2" font-size="18">12V = 12000mV</text><text class="zh" x="76" y="416" fill="#e8eef2" font-size="18">0.024A = 24mA</text><text class="zh" x="76" y="448" fill="#e8eef2" font-size="18">0.225Ω = 225mΩ</text></g>
<g>
  <rect x="570" y="170" width="574" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="596" y="204" fill="#6fe3c8" font-size="17">量级直觉</text>
  
    <text class="zh" x="620" y="258" fill="#e8eef2" font-size="18">电压</text>
    <text class="zh" x="740" y="258" fill="#8aa0ad" font-size="16">24V 是低压安全范围上限附近</text>
    <text class="zh" x="620" y="324" fill="#e8eef2" font-size="18">电流</text>
    <text class="zh" x="740" y="324" fill="#8aa0ad" font-size="16">20mA 点亮 LED；2A 驱动电机</text>
    <text class="zh" x="620" y="390" fill="#e8eef2" font-size="18">电阻</text>
    <text class="zh" x="740" y="390" fill="#8aa0ad" font-size="16">220Ω 限流；0.2Ω 已算接触不良</text>
    <text class="zh" x="620" y="456" fill="#e8eef2" font-size="18">功率</text>
    <text class="zh" x="740" y="456" fill="#8aa0ad" font-size="16">P = UI：24V×2A = 48W</text>
  <text class="zh" x="596" y="540" fill="#8aa0ad" font-size="16">读数先看单位，再比数量级。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学示例：数字后面的单位与量级，决定判断是否成立。</text>
</svg>
