<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="变量：盒子不同，装的东西不同">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes heat{0%,100%{fill:#f2c56b}50%{fill:#ff7a6b}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K3-03</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">变量：盒子不同，装的东西不同</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="1088" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  
    <rect x="86" y="200" width="500" height="150" rx="10" fill="#0e1d27" stroke="#6fe3c8"/>
    <text class="zh" x="116" y="240" fill="#6fe3c8" font-size="19">int 整数</text>
    <text class="zh" x="116" y="278" fill="#e8eef2" font-size="17">装整数：0、3、-12</text>
    <text class="zh" x="116" y="312" fill="#8aa0ad" font-size="16">12 / 5 = 2（整除截断）</text>
    <rect x="626" y="200" width="500" height="150" rx="10" fill="#0e1d27" stroke="#f2c56b"/>
    <text class="zh" x="656" y="240" fill="#f2c56b" font-size="19">float 小数</text>
    <text class="zh" x="656" y="278" fill="#e8eef2" font-size="17">装小数：1.25、24.0</text>
    <text class="zh" x="656" y="312" fill="#8aa0ad" font-size="16">12.0 / 5.0 = 2.4</text>
    <rect x="86" y="380" width="500" height="150" rx="10" fill="#0e1d27" stroke="#6fe3c8"/>
    <text class="zh" x="116" y="420" fill="#6fe3c8" font-size="19">bool 真假</text>
    <text class="zh" x="116" y="458" fill="#e8eef2" font-size="17">只有 true / false</text>
    <text class="zh" x="116" y="492" fill="#8aa0ad" font-size="16">适合状态：开/关、按/没按</text>
    <rect x="626" y="380" width="500" height="150" rx="10" fill="#0e1d27" stroke="#f2c56b"/>
    <text class="zh" x="656" y="420" fill="#f2c56b" font-size="19">char 字符</text>
    <text class="zh" x="656" y="458" fill="#e8eef2" font-size="17">单字符：'A'、'0'</text>
    <text class="zh" x="656" y="492" fill="#8aa0ad" font-size="16">注意：'0' 不是数字 0</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学示例：类型决定能装什么、能算什么；混用要先转换。</text>
</svg>
