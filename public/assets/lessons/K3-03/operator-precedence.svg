<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="运算符：先算谁，后算谁">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes heat{0%,100%{fill:#f2c56b}50%{fill:#ff7a6b}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K3-03</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">运算符：先算谁，后算谁</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="620" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="86" y="204" fill="#6fe3c8" font-size="17">优先级（高 → 低）</text>
  <text class="zh" x="86" y="244" fill="#e8eef2" font-size="18">① 括号 ( )</text><text class="zh" x="86" y="296" fill="#e8eef2" font-size="18">② 乘除 * / %</text><text class="zh" x="86" y="348" fill="#e8eef2" font-size="18">③ 加减 + -</text><text class="zh" x="86" y="400" fill="#e8eef2" font-size="18">④ 比较 < > <= >= == !=</text><text class="zh" x="86" y="452" fill="#e8eef2" font-size="18">⑤ 逻辑 && ||</text><text class="zh" x="86" y="504" fill="#e8eef2" font-size="18">⑥ 赋值 =</text>
</g>
<g>
  <rect x="700" y="170" width="450" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="726" y="204" fill="#6fe3c8" font-size="17">例：算一个电压</text>
  <text class="num" x="726" y="256" fill="#e8eef2" font-size="18">percent = 25;</text>
  <text class="num" x="726" y="296" fill="#e8eef2" font-size="18">v = 5 * percent / 100;</text>
  <text class="zh" x="726" y="344" fill="#8aa0ad" font-size="16">先算 5*25=125，再 /100=1.25</text>
  <text class="num" x="726" y="396" fill="#e8eef2" font-size="18">v2 = 5 * (percent / 100);</text>
  <text class="zh" x="726" y="444" fill="#8aa0ad" font-size="16">25/100 先整除 = 0，结果 0</text>
  <text class="zh" x="726" y="512" fill="#f2c56b" font-size="16">括号改变顺序，也改变结果。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学示例：整数运算与浮点运算差异是常见 bug 来源。</text>
</svg>
