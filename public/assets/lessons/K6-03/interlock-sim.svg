<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="门一开，动力必须归零">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K6-03 · 时序</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">门一开，动力必须归零</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="1088" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  
    <rect x="90" y="220" width="500" height="130" rx="10" fill="#0e1d27" stroke="#2a4a5e"/>
    <text class="zh" x="114" y="260" fill="#f2c56b" font-size="20">① 检修门打开</text>
    <text class="zh" x="114" y="302" fill="#e8eef2" font-size="16">门磁常闭断开 → 接触器失电</text>
    <rect x="630" y="220" width="500" height="130" rx="10" fill="#0e1d27" stroke="#2a4a5e"/>
    <text class="zh" x="654" y="260" fill="#ff7a6b" font-size="20">② 动力输出</text>
    <text class="zh" x="654" y="302" fill="#e8eef2" font-size="16">24V → 0V（≤40ms 教学限值）</text>
    <rect x="90" y="380" width="500" height="130" rx="10" fill="#0e1d27" stroke="#2a4a5e"/>
    <text class="zh" x="114" y="420" fill="#6fe3c8" font-size="20">③ 复位</text>
    <text class="zh" x="114" y="462" fill="#e8eef2" font-size="16">先关门，再按复位，才能再启动</text>
    <rect x="630" y="380" width="500" height="130" rx="10" fill="#0e1d27" stroke="#2a4a5e"/>
    <text class="zh" x="654" y="420" fill="#8aa0ad" font-size="20">④ 记录</text>
    <text class="zh" x="654" y="462" fill="#e8eef2" font-size="16">事件写日志：时间、原因、操作者</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学仿真：时序为教学压缩值；真实设备需按厂商手册与安规验证。</text>
</svg>
