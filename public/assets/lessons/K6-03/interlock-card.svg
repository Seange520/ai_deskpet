<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="联锁：把“不许动”接进回路">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K6-03</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">联锁：把“不许动”接进回路</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g><rect x="56" y="170" width="420" height="420" rx="10" fill="#12242f" stroke="#2a4a5e"/>
<text class="zh" x="76" y="200" fill="#6fe3c8" font-size="17">三种联锁接法</text><text class="zh" x="76" y="224" fill="#e8eef2" font-size="18">① 门磁：门开 → 动力回路断</text><text class="zh" x="76" y="256" fill="#e8eef2" font-size="18">② 限位：行程到点 → 停转</text><text class="zh" x="76" y="288" fill="#e8eef2" font-size="18">③ 急停：人工断开动力</text><text class="zh" x="76" y="320" fill="#e8eef2" font-size="18"></text><text class="zh" x="76" y="352" fill="#e8eef2" font-size="18">共同原则：安全信号串在</text><text class="zh" x="76" y="384" fill="#e8eef2" font-size="18">控制/动力回路里，不可软件屏蔽。</text></g>
<g>
  <rect x="520" y="170" width="624" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <g><rect x="560" y="240" width="150" height="80" rx="8" fill="#0e1d27" stroke="#ff7a6b" stroke-width="2"/>
<text class="zh" x="635" y="274" text-anchor="middle" fill="#ff7a6b" font-size="19">急停</text>
<text class="zh" x="635" y="302" text-anchor="middle" fill="#8aa0ad" font-size="15">常闭</text></g>
  <g><rect x="750" y="240" width="150" height="80" rx="8" fill="#0e1d27" stroke="#6fe3c8" stroke-width="2"/>
<text class="zh" x="825" y="274" text-anchor="middle" fill="#6fe3c8" font-size="19">门磁</text>
<text class="zh" x="825" y="302" text-anchor="middle" fill="#8aa0ad" font-size="15">常闭</text></g>
  <g><rect x="940" y="240" width="150" height="80" rx="8" fill="#0e1d27" stroke="#6fe3c8" stroke-width="2"/>
<text class="zh" x="1015" y="274" text-anchor="middle" fill="#6fe3c8" font-size="19">限位</text>
<text class="zh" x="1015" y="302" text-anchor="middle" fill="#8aa0ad" font-size="15">常闭</text></g>
  <g><rect x="560" y="400" width="300" height="100" rx="8" fill="#0e1d27" stroke="#f2c56b" stroke-width="2"/>
<text class="zh" x="710" y="434" text-anchor="middle" fill="#f2c56b" font-size="19">接触器线圈</text>
<text class="zh" x="710" y="462" text-anchor="middle" fill="#8aa0ad" font-size="15">任一断开→失电</text></g>
  <line x1="635" y1="320" x2="635" y2="400" stroke="#ff7a6b" stroke-width="3"/>
  <line x1="825" y1="320" x2="825" y2="400" stroke="#6fe3c8" stroke-width="3"/>
  <line x1="1015" y1="320" x2="1015" y2="400" stroke="#6fe3c8" stroke-width="3"/>
  <line x1="560" y1="450" x2="900" y2="450" stroke="#f2c56b" stroke-width="3"/>
  <text class="zh" x="560" y="540" fill="#8aa0ad" font-size="16">串联=与逻辑：全部闭合才通电；任何一条断开，动力立刻切断。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学示例：真实联锁须按安规设计并断电验证；仿真不在课堂环境中驱动真实电机。</text>
</svg>
