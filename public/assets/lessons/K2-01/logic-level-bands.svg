<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="高低电平：数字世界只认两道门">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes heat{0%,100%{fill:#f2c56b}50%{fill:#ff7a6b}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K2-01</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">高低电平：数字世界只认两道门</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g><rect x="56" y="170" width="430" height="420" rx="10" fill="#12242f" stroke="#2a4a5e"/>
<text class="zh" x="76" y="200" fill="#6fe3c8" font-size="17">电压分区（3.3V 逻辑）</text><text class="zh" x="76" y="224" fill="#e8eef2" font-size="18">高电平：约 2.4–3.3V（判 1）</text><text class="zh" x="76" y="256" fill="#e8eef2" font-size="18">不确定区：约 0.8–2.4V（禁止停留）</text><text class="zh" x="76" y="288" fill="#e8eef2" font-size="18">低电平：约 0–0.8V（判 0）</text><text class="zh" x="76" y="320" fill="#e8eef2" font-size="18"></text><text class="zh" x="76" y="352" fill="#e8eef2" font-size="18">为什么要有中间禁区？</text><text class="zh" x="76" y="384" fill="#e8eef2" font-size="18">模拟噪声会让边缘电压乱跳，</text><text class="zh" x="76" y="416" fill="#e8eef2" font-size="18">设计上不让信号停在中间。</text></g>
<g>
  <rect x="540" y="170" width="610" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <line x1="600" y1="540" x2="1100" y2="540" stroke="#8aa0ad" stroke-width="2"/>
  <line x1="600" y1="540" x2="600" y2="210" stroke="#8aa0ad" stroke-width="2"/>
  <rect x="600" y="210" width="500" height="90" fill="#6fe3c8" opacity=".22"/>
  <rect x="600" y="300" width="500" height="120" fill="#f2c56b" opacity=".18"/>
  <rect x="600" y="420" width="500" height="120" fill="#6fe3c8" opacity=".22"/>
  <text class="zh" x="620" y="262" fill="#6fe3c8" font-size="20">2.4–3.3V：1</text>
  <text class="zh" x="620" y="368" fill="#f2c56b" font-size="20">0.8–2.4V：不确定</text>
  <text class="zh" x="620" y="492" fill="#6fe3c8" font-size="20">0–0.8V：0</text>
  <text class="num" x="1110" y="220" fill="#8aa0ad" font-size="15">3.3V</text>
  <text class="num" x="1110" y="530" fill="#8aa0ad" font-size="15">0V</text>
  <text class="zh" x="600" y="575" fill="#8aa0ad" font-size="16">万用表直流电压档：先看量程，再读值</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学示例：不同芯片逻辑阈值不同，实际以数据手册为准。</text>
</svg>
