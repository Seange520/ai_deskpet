<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="读一个电平，写出它代表什么">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes heat{0%,100%{fill:#f2c56b}50%{fill:#ff7a6b}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K2-01 · 读电平</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">读一个电平，写出它代表什么</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="520" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="82" y="204" fill="#6fe3c8" font-size="17">电路：按钮 + 上拉</text>
  <rect x="100" y="260" width="180" height="120" rx="8" fill="#0e1d27" stroke="#2a4a5e"/>
  <text class="zh" x="190" y="300" text-anchor="middle" fill="#e8eef2" font-size="18">3.3V</text>
  <circle cx="190" cy="330" r="10" fill="#f2c56b"/>
  <line x1="190" y1="340" x2="190" y2="420" stroke="#f2c56b" stroke-width="3"/>
  <rect x="130" y="420" width="120" height="50" rx="6" fill="#0e1d27" stroke="#6fe3c8" stroke-width="2"/>
  <text class="zh" x="190" y="452" text-anchor="middle" fill="#6fe3c8" font-size="16">GPIO 输入</text>
  <text class="zh" x="100" y="524" fill="#e8eef2" font-size="16">按钮断开：被上拉 → 读 1</text>
  <text class="zh" x="100" y="556" fill="#e8eef2" font-size="16">按钮按下：接 0V → 读 0</text>
</g>
<g>
  <rect x="620" y="170" width="530" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="646" y="204" fill="#6fe3c8" font-size="17">读数与判断</text>
  <rect x="646" y="232" width="300" height="80" rx="8" fill="#162b2f" stroke="#6fe3c8" stroke-width="2"/>
  <text class="num" x="796" y="286" text-anchor="middle" fill="#6fe3c8" font-size="40">3.28 V</text>
  <text class="zh" x="646" y="352" fill="#e8eef2" font-size="18">高于 2.4V → 逻辑 1</text>
  <text class="zh" x="646" y="388" fill="#e8eef2" font-size="18">若读数在 0.8–2.4V：检查上拉/接线</text>
  <text class="zh" x="646" y="424" fill="#e8eef2" font-size="18">若读数 0V 但按钮没按：可能短路到地</text>
  <text class="zh" x="646" y="480" fill="#8aa0ad" font-size="16">先量电压，再谈代码：硬件状态是代码的输入。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">仿真演练：读数来自确定性教学模型，电压读数保留两位小数。</text>
</svg>
