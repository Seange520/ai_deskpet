<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="一次隔离，锁定断点">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes sweep{0%{transform:translateX(0)}100%{transform:translateX(640px)}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE WEAVE / 检修手册 · K4-06 · 排障演练</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">一次隔离，锁定断点</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="520" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="82" y="204" fill="#6fe3c8" font-size="17">测量记录</text>
  <text class="zh" x="82" y="250" fill="#e8eef2" font-size="18">① 整条总线：扫描 0 设备</text><text class="zh" x="82" y="300" fill="#e8eef2" font-size="18">② 断开 U5 之后：扫描到 3 个</text><text class="zh" x="82" y="350" fill="#e8eef2" font-size="18">③ 故障在 U5-U6 段</text><text class="zh" x="82" y="400" fill="#e8eef2" font-size="18">④ 测该段通断：OL（开路）</text><text class="zh" x="82" y="450" fill="#e8eef2" font-size="18">⑤ 修复线缆后：扫描 5 个</text>
</g>
<g>
  <rect x="610" y="170" width="534" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="636" y="204" fill="#6fe3c8" font-size="17">结论模板</text>
  <text class="zh" x="636" y="256" fill="#e8eef2" font-size="18">现象：掉线/扫描缺失</text>
  <text class="zh" x="636" y="296" fill="#e8eef2" font-size="18">证据：断段后恢复、OL</text>
  <text class="zh" x="636" y="336" fill="#e8eef2" font-size="18">根因：U5-U6 线缆虚接</text>
  <text class="zh" x="636" y="376" fill="#e8eef2" font-size="18">修复：重压接/换线</text>
  <text class="zh" x="636" y="416" fill="#e8eef2" font-size="18">验证：复扫全设备在线</text>
  <text class="zh" x="636" y="486" fill="#8aa0ad" font-size="16">没有“复扫通过”，就不算修好。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">仿真演练：排障数据来自教学模型；真实总线还需查上拉、地线与干扰。</text>
</svg>
