<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="总线排障：先分段，再二分">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes sweep{0%{transform:translateX(0)}100%{transform:translateX(640px)}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE WEAVE / 检修手册 · K4-06</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">总线排障：先分段，再二分</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="1088" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <g><rect x="90" y="230" width="160" height="90" rx="8" fill="#0e1d27" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="170" y="264" text-anchor="middle" fill="#2a4a5e" font-size="19">主设备</text>
<text class="zh" x="170" y="292" text-anchor="middle" fill="#8aa0ad" font-size="15">设备 0</text></g><g><rect x="300" y="230" width="160" height="90" rx="8" fill="#0e1d27" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="380" y="264" text-anchor="middle" fill="#2a4a5e" font-size="19">节点 A</text>
<text class="zh" x="380" y="292" text-anchor="middle" fill="#8aa0ad" font-size="15">设备 1</text></g><g><rect x="510" y="230" width="160" height="90" rx="8" fill="#0e1d27" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="590" y="264" text-anchor="middle" fill="#2a4a5e" font-size="19">节点 B</text>
<text class="zh" x="590" y="292" text-anchor="middle" fill="#8aa0ad" font-size="15">设备 2</text></g><g><rect x="720" y="230" width="160" height="90" rx="8" fill="#0e1d27" stroke="#ff7a6b" stroke-width="2"/>
<text class="zh" x="800" y="264" text-anchor="middle" fill="#ff7a6b" font-size="19">节点 C</text>
<text class="zh" x="800" y="292" text-anchor="middle" fill="#8aa0ad" font-size="15">设备 3</text></g><g><rect x="930" y="230" width="160" height="90" rx="8" fill="#0e1d27" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="1010" y="264" text-anchor="middle" fill="#2a4a5e" font-size="19">节点 D</text>
<text class="zh" x="1010" y="292" text-anchor="middle" fill="#8aa0ad" font-size="15">设备 4</text></g>
  <line x1="250" y1="275" x2="300" y2="275" stroke="#2a4a5e" stroke-width="3"/><line x1="460" y1="275" x2="510" y2="275" stroke="#2a4a5e" stroke-width="3"/><line x1="670" y1="275" x2="720" y2="275" stroke="#2a4a5e" stroke-width="3"/><line x1="880" y1="275" x2="930" y2="275" stroke="#2a4a5e" stroke-width="3"/>
  <text class="zh" x="86" y="400" fill="#e8eef2" font-size="18">① 断开后半段：看前半段是否恢复</text>
  <text class="zh" x="86" y="440" fill="#e8eef2" font-size="18">② 故障在前半 → 继续二分；在后半 → 查后半段</text>
  <text class="zh" x="86" y="480" fill="#e8eef2" font-size="18">③ 直到只剩一个节点/一段线 → 测量确认</text>
  <text class="zh" x="86" y="540" fill="#8aa0ad" font-size="16">二分把“猜”变成 log₂(n) 次隔离；每步都要有测量证据。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学示例：二分排障适用于总线、供电与网络链路；先断电再改线。</text>
</svg>
