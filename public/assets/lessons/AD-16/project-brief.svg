<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#0b1620"/>
  <g stroke="#1d3442" stroke-width="1" opacity="0.55">
    <path d="M0 90H1200M0 180H1200M0 270H1200M0 360H1200M0 450H1200M0 540H1200M0 630H1200"/>
    <path d="M80 0V675M240 0V675M400 0V675M560 0V675M720 0V675M880 0V675M1040 0V675"/>
  </g>
  <text x="80" y="56" fill="#6f8f99" font-family="Consolas, monospace" font-size="15" letter-spacing="3">THE ECHO SPIRE / 检修手册 · AD-16 · 项目立项</text>
  <text x="80" y="112" fill="#e8f4f8" font-family="'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="34" font-weight="700">先写清验收，再动手</text>
  <path d="M80 136H1120" stroke="#2f5b68" stroke-width="1.5"/>

  <g font-family="'Microsoft YaHei', 'Noto Sans SC', sans-serif">
    <g>
      <rect x="80" y="170" width="320" height="230" rx="8" fill="#102430" stroke="#2f5b68"/>
      <text x="104" y="208" fill="#7c97a0" font-family="Consolas, monospace" font-size="13">BRIEF 01 · 快</text>
      <text x="104" y="244" fill="#e8f4f8" font-size="21" font-weight="700">「反应快一点」</text>
      <text x="104" y="280" fill="#9fb8bd" font-size="15">改成：触发到动作 ≤100ms</text>
      <text x="104" y="310" fill="#9fb8bd" font-size="15">场景：唤醒动作 + 表情切换</text>
      <text x="104" y="340" fill="#9fb8bd" font-size="15">复现：同一设备连测 20 次取中位</text>
      <text x="104" y="376" fill="#4fd1c5" font-family="Consolas, monospace" font-size="13">MEASURABLE</text>
    </g>
    <g>
      <rect x="440" y="170" width="320" height="230" rx="8" fill="#102430" stroke="#2f5b68"/>
      <text x="464" y="208" fill="#7c97a0" font-family="Consolas, monospace" font-size="13">BRIEF 02 · 省电</text>
      <text x="464" y="244" fill="#e8f4f8" font-size="21" font-weight="700">「尽量省电」</text>
      <text x="464" y="280" fill="#9fb8bd" font-size="15">改成：待机电流 ≤20mA</text>
      <text x="464" y="310" fill="#9fb8bd" font-size="15">条件：屏熄、无动作、静置 60s</text>
      <text x="464" y="340" fill="#9fb8bd" font-size="15">复现：万用表串在电池回路</text>
      <text x="464" y="376" fill="#ffd487" font-family="Consolas, monospace" font-size="13">BOUNDED</text>
    </g>
    <g>
      <rect x="800" y="170" width="320" height="230" rx="8" fill="#102430" stroke="#3c6b4f"/>
      <text x="824" y="208" fill="#7c97a0" font-family="Consolas, monospace" font-size="13">BRIEF 03 · 保存</text>
      <text x="824" y="244" fill="#e8f4f8" font-size="21" font-weight="700">「别忘了保存」</text>
      <text x="824" y="280" fill="#9fb8bd" font-size="15">改成：断电后 3 秒内恢复进度</text>
      <text x="824" y="310" fill="#9fb8bd" font-size="15">场景：直接拔电，不按关机</text>
      <text x="824" y="340" fill="#9fb8bd" font-size="15">复现：重上电观察首屏进度</text>
      <text x="824" y="376" fill="#8fe3a8" font-family="Consolas, monospace" font-size="13">REPRODUCIBLE</text>
    </g>
  </g>

  <g font-family="'Microsoft YaHei', 'Noto Sans SC', sans-serif">
    <rect x="80" y="430" width="1040" height="150" rx="8" fill="#0f1f2a" stroke="#2f5b68"/>
    <text x="104" y="470" fill="#ffd487" font-size="19" font-weight="700">任务单三件套：需求 → 约束 → 验收</text>
    <text x="104" y="504" fill="#9fb8bd" font-size="16">需求：要解决什么现象，谁受影响，什么时候算解决。</text>
    <text x="104" y="530" fill="#9fb8bd" font-size="16">约束：接口、供电、预算、时间，哪条不能破。</text>
    <text x="104" y="556" fill="#9fb8bd" font-size="16">验收：数值、范围、复现步骤；第三方照着测，结果一致。</text>
  </g>
  <text x="80" y="640" fill="#6f8f99" font-size="14">教学示意：验收标准写进任务单，口头承诺不参与验收；基线数据与测试条件一起存档。</text>
</svg>
