<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="AI 不是魔法：数据进，判断出">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE SYMBIOSIS / 检修手册 · K7-01</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">AI 不是魔法：数据进，判断出</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="1088" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  
    <rect x="90" y="260" width="170" height="120" rx="10" fill="#0e1d27" stroke="#6fe3c8"/>
    <text class="zh" x="175" y="310" text-anchor="middle" fill="#6fe3c8" font-size="20">数据</text>
    <text class="zh" x="175" y="348" text-anchor="middle" fill="#8aa0ad" font-size="15">采集/标注</text>
    <line x1="260" y1="320" x2="290" y2="320" stroke="#f2c56b" stroke-width="3"/>
    <rect x="295" y="260" width="170" height="120" rx="10" fill="#0e1d27" stroke="#6fe3c8"/>
    <text class="zh" x="380" y="310" text-anchor="middle" fill="#6fe3c8" font-size="20">特征</text>
    <text class="zh" x="380" y="348" text-anchor="middle" fill="#8aa0ad" font-size="15">可区分的信息</text>
    <line x1="465" y1="320" x2="495" y2="320" stroke="#f2c56b" stroke-width="3"/>
    <rect x="500" y="260" width="170" height="120" rx="10" fill="#0e1d27" stroke="#6fe3c8"/>
    <text class="zh" x="585" y="310" text-anchor="middle" fill="#6fe3c8" font-size="20">模型</text>
    <text class="zh" x="585" y="348" text-anchor="middle" fill="#8aa0ad" font-size="15">学到的规律</text>
    <line x1="670" y1="320" x2="700" y2="320" stroke="#f2c56b" stroke-width="3"/>
    <rect x="705" y="260" width="170" height="120" rx="10" fill="#0e1d27" stroke="#6fe3c8"/>
    <text class="zh" x="790" y="310" text-anchor="middle" fill="#6fe3c8" font-size="20">预测</text>
    <text class="zh" x="790" y="348" text-anchor="middle" fill="#8aa0ad" font-size="15">给新样本</text>
    <line x1="875" y1="320" x2="905" y2="320" stroke="#f2c56b" stroke-width="3"/>
    <rect x="910" y="260" width="170" height="120" rx="10" fill="#0e1d27" stroke="#6fe3c8"/>
    <text class="zh" x="995" y="310" text-anchor="middle" fill="#6fe3c8" font-size="20">评估</text>
    <text class="zh" x="995" y="348" text-anchor="middle" fill="#8aa0ad" font-size="15">对错与置信</text>
    
  <text class="zh" x="86" y="470" fill="#e8eef2" font-size="17">训练用一部分数据，测试用没见过的数据——这样才能看出它是否真的学到。</text>
  <text class="zh" x="86" y="510" fill="#8aa0ad" font-size="16">准确率是证据；置信度低时要人复核。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学示例：流程图为概念模型；真实系统的数据与评估更复杂。</text>
</svg>
