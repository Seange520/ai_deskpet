<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="上拉、下拉与去抖：按钮不是瞬间干净的">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes heat{0%,100%{fill:#f2c56b}50%{fill:#ff7a6b}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K2-04</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">上拉、下拉与去抖：按钮不是瞬间干净的</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g><rect x="56" y="170" width="470" height="420" rx="10" fill="#12242f" stroke="#2a4a5e"/>
<text class="zh" x="76" y="200" fill="#6fe3c8" font-size="17">上拉 vs 下拉</text><text class="zh" x="76" y="224" fill="#e8eef2" font-size="18">上拉：默认高电平，按下接 0V</text><text class="zh" x="76" y="256" fill="#e8eef2" font-size="18">下拉：默认低电平，按下接 3.3V</text><text class="zh" x="76" y="288" fill="#e8eef2" font-size="18">选哪个，取决于电路与习惯</text><text class="zh" x="76" y="320" fill="#e8eef2" font-size="18"></text><text class="zh" x="76" y="352" fill="#e8eef2" font-size="18">悬空引脚 = 未知电平</text><text class="zh" x="76" y="384" fill="#e8eef2" font-size="18">噪声、静电都能让它乱跳</text></g>
<g>
  <rect x="570" y="170" width="580" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="600" y="204" fill="#6fe3c8" font-size="17">按钮的电气真相</text>
  <text class="zh" x="600" y="240" fill="#e8eef2" font-size="17">按下/松开的几毫秒内，触点会抖动</text>
  <path d="M620 340L620 280H860V340H1100" fill="none" stroke="#f2c56b" stroke-width="3"/>
  <text class="zh" x="620" y="380" fill="#8aa0ad" font-size="16">原始电平：可能读出多次跳变</text>
  <path d="M620 490L620 430H1100" fill="none" stroke="#6fe3c8" stroke-width="3"/>
  <text class="zh" x="620" y="530" fill="#8aa0ad" font-size="16">去抖后：只认一次状态变化</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学示例：抖动时长与具体器件有关，去抖窗口一般 5–20ms。</text>
</svg>
