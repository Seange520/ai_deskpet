<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="代码里怎么让“抖”变“稳”">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes heat{0%,100%{fill:#f2c56b}50%{fill:#ff7a6b}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K2-04 · 去抖逻辑</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">代码里怎么让“抖”变“稳”</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="1088" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="86" y="204" fill="#6fe3c8" font-size="17">两种常用写法</text>
  <rect x="86" y="232" width="430" height="320" rx="8" fill="#0e1d27" stroke="#2a4a5e"/>
  <text class="num" x="110" y="286" fill="#f2c56b" font-size="18">A. 延时再读</text>
  <pre class="num" x="0" y="0"></pre>
  <text class="num" x="110" y="330" fill="#e8eef2" font-size="15">if (read(pin) != stable) {</text>
  <text class="num" x="110" y="360" fill="#e8eef2" font-size="15">  delay(10); // 等抖完</text>
  <text class="num" x="110" y="390" fill="#e8eef2" font-size="15">  stable = read(pin);</text>
  <text class="num" x="110" y="420" fill="#e8eef2" font-size="15">}</text>
  <text class="zh" x="110" y="478" fill="#8aa0ad" font-size="16">简单；但会阻塞主循环</text>
  <rect x="566" y="232" width="430" height="320" rx="8" fill="#0e1d27" stroke="#2a4a5e"/>
  <text class="num" x="590" y="286" fill="#6fe3c8" font-size="18">B. 定时采样状态机</text>
  <text class="num" x="590" y="330" fill="#e8eef2" font-size="15">每 5ms 采样一次</text>
  <text class="num" x="590" y="360" fill="#e8eef2" font-size="15">连续 3 次一致才接受</text>
  <text class="num" x="590" y="390" fill="#e8eef2" font-size="15">raw 与 debounced 分开存</text>
  <text class="num" x="590" y="420" fill="#e8eef2" font-size="15">状态变化时更新并记录</text>
  <text class="zh" x="590" y="478" fill="#8aa0ad" font-size="16">推荐：不阻塞、可复用、易测试</text>
  <text class="zh" x="86" y="560" fill="#8aa0ad" font-size="16">教学口径：只要求前端白名单选项判分，不执行任意用户代码。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">代码为教学伪代码，演示去抖思路，不保证可直接烧录。</text>
</svg>
