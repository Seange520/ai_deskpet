<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="焊点三态：亮圆润、灰暗、连锡">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K0-06</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">焊点三态：亮圆润、灰暗、连锡</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="1088" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  
    <rect x="90" y="220" width="320" height="300" rx="10" fill="#0e1d27" stroke="#2a4a5e"/>
    <text class="zh" x="250" y="268" text-anchor="middle" fill="#6fe3c8" font-size="21">良好</text>
    <circle cx="250" cy="350" r="44" fill="#6fe3c8" opacity="0.95"/>
    <text class="zh" x="250" y="440" text-anchor="middle" fill="#e8eef2" font-size="15">亮、圆润、浸润焊盘</text>
    <rect x="440" y="220" width="320" height="300" rx="10" fill="#0e1d27" stroke="#2a4a5e"/>
    <text class="zh" x="600" y="268" text-anchor="middle" fill="#f2c56b" font-size="21">虚焊</text>
    <circle cx="600" cy="350" r="44" fill="#f2c56b" opacity="0.45"/>
    <text class="zh" x="600" y="440" text-anchor="middle" fill="#e8eef2" font-size="15">灰暗、成球、不浸润</text>
    <rect x="790" y="220" width="320" height="300" rx="10" fill="#0e1d27" stroke="#2a4a5e"/>
    <text class="zh" x="950" y="268" text-anchor="middle" fill="#ff7a6b" font-size="21">连锡</text>
    <circle cx="950" cy="350" r="44" fill="#ff7a6b" opacity="0.8"/>
    <text class="zh" x="950" y="440" text-anchor="middle" fill="#e8eef2" font-size="15">相邻焊点桥接</text>
  <text class="zh" x="90" y="570" fill="#8aa0ad" font-size="16">焊接质量靠练习；本项目为虚拟教学，不要求真实动火。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学示例：真实焊接需通风、护目与防烫；新手在指导下练习。</text>
</svg>
