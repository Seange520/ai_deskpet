<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="动火五件事，少一件都别开工">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K0-06 · 安全</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">动火五件事，少一件都别开工</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g><rect x="56" y="170" width="470" height="420" rx="10" fill="#12242f" stroke="#2a4a5e"/>
<text class="zh" x="76" y="200" fill="#6fe3c8" font-size="17">安全清单</text><text class="zh" x="76" y="224" fill="#e8eef2" font-size="18">① 通风：开窗/风扇排烟</text><text class="zh" x="76" y="256" fill="#e8eef2" font-size="18">② 烙铁架：随手放回，不搁桌面</text><text class="zh" x="76" y="288" fill="#e8eef2" font-size="18">③ 镊子/钳子：夹持，不烫手</text><text class="zh" x="76" y="320" fill="#e8eef2" font-size="18">④ 断电清洁：清洁前先断电</text><text class="zh" x="76" y="352" fill="#e8eef2" font-size="18">⑤ 防烫：不甩锡、不摸头</text><text class="zh" x="76" y="384" fill="#e8eef2" font-size="18"></text><text class="zh" x="76" y="416" fill="#e8eef2" font-size="18">温度：350°C 左右；</text><text class="zh" x="76" y="448" fill="#e8eef2" font-size="18">不追求“一点就亮”。</text></g>
<g>
  <rect x="570" y="170" width="574" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="596" y="204" fill="#6fe3c8" font-size="17">常见错误</text>
  
    <text class="zh" x="620" y="258" fill="#e8eef2" font-size="17">1. 烙铁搁桌面 → 烫坏桌面/线材</text>
    <text class="zh" x="620" y="314" fill="#e8eef2" font-size="17">2. 吹锡/甩锡 → 烫伤眼睛</text>
    <text class="zh" x="620" y="370" fill="#e8eef2" font-size="17">3. 虚焊靠“加焊锡” → 短路</text>
    <text class="zh" x="620" y="426" fill="#e8eef2" font-size="17">4. 带电焊接 → 击穿元件</text>
  <text class="zh" x="596" y="540" fill="#8aa0ad" font-size="16">不确定就停下来问；安全永远优先于进度。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学示例：本项目为虚拟教学，不要求真实动火；真实操作须在指导与防护下进行。</text>
</svg>
