<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="HTTP 请求：方法 + 路径 + 头 + 体">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes sweep{0%{transform:translateX(0)}100%{transform:translateX(640px)}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE ECHO / 检修手册 · K5-02</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">HTTP 请求：方法 + 路径 + 头 + 体</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="1088" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <rect x="90" y="220" width="520" height="330" rx="8" fill="#0e1d27" stroke="#2a4a5e"/>
  <text class="num" x="116" y="266" fill="#6fe3c8" font-size="17">POST /api/lamp HTTP/1.1</text>
  <text class="num" x="116" y="304" fill="#e8eef2" font-size="16">Host: api.example.local</text>
  <text class="num" x="116" y="340" fill="#e8eef2" font-size="16">Content-Type: application/json</text>
  <text class="num" x="116" y="376" fill="#8aa0ad" font-size="16">User-Agent: checksum/1.0</text>
  <text class="num" x="116" y="424" fill="#e8eef2" font-size="16">{</text>
  <text class="num" x="140" y="456" fill="#f2c56b" font-size="16">"lamp": 1,</text>
  <text class="num" x="140" y="488" fill="#f2c56b" font-size="16">"temp": 24.0</text>
  <text class="num" x="116" y="524" fill="#e8eef2" font-size="16">}</text>
  <rect x="650" y="220" width="494" height="330" rx="8" fill="#0e1d27" stroke="#2a4a5e"/>
  <text class="num" x="676" y="266" fill="#6fe3c8" font-size="17">响应</text>
  <text class="num" x="676" y="304" fill="#6fe3c8" font-size="17">200 OK</text>
  <text class="num" x="676" y="340" fill="#6fe3c8" font-size="17">Content-Type: application/json</text>
  <text class="num" x="676" y="392" fill="#e8eef2" font-size="16">{ "ok": true, "queued": 1 }</text>
  <text class="zh" x="676" y="456" fill="#8aa0ad" font-size="16">状态码 + JSON 字段，才是可验证的结果。</text>
  <text class="zh" x="676" y="496" fill="#8aa0ad" font-size="16">超时、重试、幂等要一起设计。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学仿真：示例请求不指向真实服务；不在课堂环境中发送真实令牌。</text>
</svg>
