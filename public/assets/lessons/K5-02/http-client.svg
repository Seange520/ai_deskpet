<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="一次请求，四个动作">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes sweep{0%{transform:translateX(0)}100%{transform:translateX(640px)}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE ECHO / 检修手册 · K5-02 · 客户端流程</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">一次请求，四个动作</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="1088" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  
    <rect x="90" y="230" width="240" height="230" rx="10" fill="#0e1d27" stroke="#2a4a5e"/>
    <text class="zh" x="210" y="284" text-anchor="middle" fill="#6fe3c8" font-size="21">① 组请求</text>
    <text class="zh" x="210" y="330" text-anchor="middle" fill="#e8eef2" font-size="15">方法 / 路径 / 头 / JSON 体</text>
    <rect x="360" y="230" width="240" height="230" rx="10" fill="#0e1d27" stroke="#2a4a5e"/>
    <text class="zh" x="480" y="284" text-anchor="middle" fill="#6fe3c8" font-size="21">② 发出去</text>
    <text class="zh" x="480" y="330" text-anchor="middle" fill="#e8eef2" font-size="15">连接超时、读超时</text>
    <rect x="630" y="230" width="240" height="230" rx="10" fill="#0e1d27" stroke="#2a4a5e"/>
    <text class="zh" x="750" y="284" text-anchor="middle" fill="#6fe3c8" font-size="21">③ 解析响应</text>
    <text class="zh" x="750" y="330" text-anchor="middle" fill="#e8eef2" font-size="15">先看状态码，再解 JSON</text>
    <rect x="900" y="230" width="240" height="230" rx="10" fill="#0e1d27" stroke="#2a4a5e"/>
    <text class="zh" x="1020" y="284" text-anchor="middle" fill="#6fe3c8" font-size="21">④ 处理错误</text>
    <text class="zh" x="1020" y="330" text-anchor="middle" fill="#e8eef2" font-size="15">4xx 客户端；5xx 服务端；重试+退避</text>
  <text class="zh" x="86" y="520" fill="#8aa0ad" font-size="16">别把“HTTP 返回了”当成“业务成功了”；检查 statusCode 与响应字段。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学示例：真实项目要加入 TLS、鉴权与限流；示例不发送真实令牌。</text>
</svg>
