<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Microsoft YaHei', 'Noto Sans SC', sans-serif">
  <rect width="1200" height="675" fill="#07161c"/>
  <g stroke="#0f2b34" stroke-width="1">
    <path d="M0 40H1200M0 140H1200M0 240H1200M0 340H1200M0 440H1200M0 540H1200M0 640H1200"/>
    <path d="M40 0V675M240 0V675M440 0V675M640 0V675M840 0V675M1040 0V675"/>
  </g>
  <text x="48" y="42" fill="#4fd1c5" font-family="Consolas, monospace" font-size="15" letter-spacing="3">THE FORGE / 检修手册 · IC-09 · 版图</text>
  <text x="48" y="108" fill="#f2f7f8" font-size="40" font-weight="700">版图：把电路画成几何</text>
  <text x="48" y="156" fill="#9fb8bd" font-size="20">原理图说明谁连谁，版图决定造出来能不能跑。</text>

  <g>
    <rect x="48" y="196" width="520" height="248" rx="10" fill="#0b2028" stroke="#12333d"/>
    <text x="72" y="234" fill="#4fd1c5" font-size="20" font-weight="700">① 三条最小尺寸（0.18µm 工艺）</text>
    <text x="72" y="286" fill="#e8f2f2" font-size="18">线宽 ≥ <tspan fill="#ffd487" font-family="Consolas, monospace">0.18 µm</tspan>（再细画不出来）</text>
    <text x="72" y="330" fill="#e8f2f2" font-size="18">间距 ≥ <tspan fill="#ffd487" font-family="Consolas, monospace">0.20 µm</tspan>（太近会短路）</text>
    <text x="72" y="374" fill="#e8f2f2" font-size="18">接触孔包围 ≥ <tspan fill="#ffd487" font-family="Consolas, monospace">0.05 µm</tspan>（包不住会断）</text>
    <text x="72" y="416" fill="#6f8f99" font-size="14">规则来自工艺能力，不是画图习惯。</text>
  </g>

  <g>
    <rect x="600" y="196" width="552" height="248" rx="10" fill="#0b2028" stroke="#12333d"/>
    <text x="624" y="234" fill="#4fd1c5" font-size="20" font-weight="700">② DRC：几何先过关</text>
    <text x="624" y="282" fill="#e8f2f2" font-size="17">线宽 0.12µm → 违例（宽度）</text>
    <text x="624" y="322" fill="#e8f2f2" font-size="17">间距 0.12µm → 违例（间距）</text>
    <text x="624" y="362" fill="#e8f2f2" font-size="17">包围 0.02µm → 违例（包围）</text>
    <text x="624" y="404" fill="#ffd487" font-size="15">DRC 查几何；LVS 查连接是否与原理图一致。</text>
  </g>

  <g>
    <rect x="48" y="470" width="1104" height="128" rx="10" fill="#0b2028" stroke="#12333d"/>
    <text x="72" y="506" fill="#4fd1c5" font-size="18" font-weight="700">③ 一次流片，几何的错误按“次”算钱</text>
    <text x="72" y="544" fill="#e8f2f2" font-size="17">教学用 0.18µm 数值演示规则；真实项目以代工厂 PDK 和 DRC deck 为准。</text>
    <text x="72" y="578" fill="#6f8f99" font-size="14">先跑 DRC，再跑 LVS，最后才把版图交给工厂。</text>
  </g>
  <text x="48" y="644" fill="#6f8f99" font-size="14">教学示意：版图不直接带电；真实流片需 DRC/LVS 清洁并核对 PDK 版本。</text>
</svg>
