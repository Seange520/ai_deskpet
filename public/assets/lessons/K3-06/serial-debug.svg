<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="用打印缩小嫌疑范围">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes sweep{0%{transform:translateX(0)}100%{transform:translateX(640px)}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K3-06 · 调试演练</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">用打印缩小嫌疑范围</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="500" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="82" y="204" fill="#6fe3c8" font-size="17">二分排查</text>
  <text class="zh" x="82" y="246" fill="#e8eef2" font-size="18">① 打印“进入函数”</text><text class="zh" x="82" y="292" fill="#e8eef2" font-size="18">② 打印“读到值”</text><text class="zh" x="82" y="338" fill="#e8eef2" font-size="18">③ 打印“判断结果”</text><text class="zh" x="82" y="384" fill="#e8eef2" font-size="18">④ 打印“输出完成”</text><text class="zh" x="82" y="430" fill="#e8eef2" font-size="18"></text><text class="zh" x="82" y="476" fill="#e8eef2" font-size="18">哪一行没有出现，问题就在它前面。</text>
</g>
<g>
  <rect x="590" y="170" width="554" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="616" y="204" fill="#6fe3c8" font-size="17">例：灯不亮</text>
  <text class="num" x="616" y="252" fill="#e8eef2" font-size="17">&gt; enter loop</text>
  <text class="num" x="616" y="290" fill="#e8eef2" font-size="17">&gt; read btn = 0</text>
  <text class="num" x="616" y="328" fill="#e8eef2" font-size="17">&gt; judge: lamp ON</text>
  <text class="num" x="616" y="366" fill="#ff7a6b" font-size="17">&gt; write LED ... (无输出)</text>
  <text class="zh" x="616" y="420" fill="#e8eef2" font-size="18">→ 问题在“写 LED”这一步：</text>
  <text class="zh" x="616" y="454" fill="#e8eef2" font-size="18">引脚配置错 / 灯接反 / 限流缺失</text>
  <text class="zh" x="616" y="510" fill="#8aa0ad" font-size="16">打印能定位区间，测量能确认根因。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学示例：串口助手为只读观察窗口，不进行真实设备写入。</text>
</svg>
