<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="调一个数字，观察频率与亮度">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes sweep{0%{transform:translateX(0)}100%{transform:translateX(640px)}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K3-05 · 动画</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">调一个数字，观察频率与亮度</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="1088" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="86" y="204" fill="#6fe3c8" font-size="17">两通道对比</text>
  <text class="zh" x="86" y="286" fill="#e8eef2" font-size="19">通道 A：2Hz · 50%</text>
  <path d="M320 320L320 260H670V320H1020" fill="none" stroke="#6fe3c8" stroke-width="3"/>
  <text class="zh" x="86" y="416" fill="#e8eef2" font-size="19">通道 B：4Hz · 50%</text>
  <path d="M320 450L320 390H670V450H1020" fill="none" stroke="#f2c56b" stroke-width="3"/>
  <text class="zh" x="86" y="510" fill="#8aa0ad" font-size="16">频率翻倍，周期减半；占空比相同 → 平均电压相同。</text>
  <circle cx="1040" cy="290" r="14" fill="#f2c56b"/>
  <circle cx="1040" cy="420" r="14" fill="#f2c56b"/>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">动画资产：静音可用；LED 亮度为教学近似，真实亮度受驱动与视觉特性影响。</text>
</svg>
