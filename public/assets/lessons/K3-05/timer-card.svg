<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="定时器：时间也是参数">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes sweep{0%{transform:translateX(0)}100%{transform:translateX(640px)}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K3-05</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">定时器：时间也是参数</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g><rect x="56" y="170" width="470" height="420" rx="10" fill="#12242f" stroke="#2a4a5e"/>
<text class="zh" x="76" y="200" fill="#6fe3c8" font-size="17">三种时间工具</text><text class="zh" x="76" y="224" fill="#e8eef2" font-size="18">delay(ms)：阻塞等待</text><text class="zh" x="76" y="256" fill="#e8eef2" font-size="18">millis()：读取开机后毫秒数</text><text class="zh" x="76" y="288" fill="#e8eef2" font-size="18">定时器中断 / 非阻塞调度：到点做事</text><text class="zh" x="76" y="320" fill="#e8eef2" font-size="18"></text><text class="zh" x="76" y="352" fill="#e8eef2" font-size="18">周期 T 与频率 f：</text><text class="zh" x="76" y="384" fill="#e8eef2" font-size="18">f = 1 / T（秒）</text><text class="zh" x="76" y="416" fill="#e8eef2" font-size="18">2Hz → 周期 0.5 秒 = 500ms</text></g>
<g>
  <rect x="570" y="170" width="574" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="596" y="204" fill="#6fe3c8" font-size="17">2Hz 方波：高 250ms / 低 250ms</text>
  <path d="M620 380L620 280H870V380H1120" fill="none" stroke="#6fe3c8" stroke-width="3"/>
  <line x1="620" y1="430" x2="1120" y2="430" stroke="#8aa0ad" stroke-width="2"/>
  <text class="num" x="620" y="456" fill="#8aa0ad" font-size="15">0</text>
  <text class="num" x="710" y="456" fill="#8aa0ad" font-size="15">250ms</text>
  <text class="num" x="810" y="456" fill="#8aa0ad" font-size="15">500ms</text>
  <text class="zh" x="620" y="510" fill="#e8eef2" font-size="17">占空比 50%：高电平占周期的一半</text>
  <text class="zh" x="620" y="546" fill="#8aa0ad" font-size="16">调频率改周期，调占空比改亮度。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学示例：PWM 频率与占空比是两件独立的事。</text>
</svg>
