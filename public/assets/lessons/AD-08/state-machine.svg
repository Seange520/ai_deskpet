<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="AD-08 桌宠状态机：待机、唤醒、工作、休眠与合法转移">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#12262b" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4fd1c5"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6f8f99"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#08161a"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <text x="48" y="64" fill="#4fd1c5" font-family="Consolas, monospace" font-size="17" letter-spacing="2">THE FORGE / 检修手册 · AD-08</text>
  <text x="48" y="108" fill="#e6f7f5" font-family="Microsoft YaHei, sans-serif" font-size="38" font-weight="700">状态机：让桌宠自己醒来</text>
  <line x1="48" y1="128" x2="1152" y2="128" stroke="#1d3a40" stroke-width="2"/>

  <g font-family="Microsoft YaHei, sans-serif">
    <rect x="72" y="252" width="210" height="96" rx="12" fill="#0d2328" stroke="#2b5b63"/>
    <text x="177" y="294" fill="#9fb8bd" font-size="20" text-anchor="middle">待机</text>
    <text x="177" y="320" fill="#6f8f99" font-size="13" text-anchor="middle">等唤醒事件</text>

    <rect x="348" y="252" width="210" height="96" rx="12" fill="#0d2328" stroke="#2b5b63"/>
    <text x="453" y="294" fill="#9fb8bd" font-size="20" text-anchor="middle">唤醒</text>
    <text x="453" y="320" fill="#6f8f99" font-size="13" text-anchor="middle">亮屏自检</text>

    <rect x="624" y="252" width="210" height="96" rx="12" fill="#0d2328" stroke="#4fd1c5"/>
    <text x="729" y="294" fill="#d7ece9" font-size="20" text-anchor="middle">工作</text>
    <text x="729" y="320" fill="#6f8f99" font-size="13" text-anchor="middle">执行任务</text>

    <rect x="900" y="252" width="210" height="96" rx="12" fill="#0d2328" stroke="#2b5b63"/>
    <text x="1005" y="294" fill="#9fb8bd" font-size="20" text-anchor="middle">休眠</text>
    <text x="1005" y="320" fill="#6f8f99" font-size="13" text-anchor="middle">低功耗等待</text>

    <line x1="282" y1="300" x2="340" y2="300" stroke="#4fd1c5" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="311" y="288" fill="#8fe3d8" font-size="13" text-anchor="middle">唤醒</text>

    <line x1="558" y1="300" x2="616" y2="300" stroke="#4fd1c5" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="587" y="288" fill="#8fe3d8" font-size="13" text-anchor="middle">开始工作</text>

    <line x1="834" y1="300" x2="892" y2="300" stroke="#4fd1c5" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="863" y="288" fill="#8fe3d8" font-size="13" text-anchor="middle">休眠 / 超时</text>

    <path d="M1005 348V412H453V352" fill="none" stroke="#6f8f99" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-dim)"/>
    <text x="729" y="404" fill="#9fb8bd" font-size="13" text-anchor="middle">休眠中被唤醒 → 回到唤醒态</text>

    <line x1="120" y1="252" x2="120" y2="196" stroke="#6f8f99" stroke-width="2" marker-end="url(#arrow-dim)"/>
    <text x="128" y="188" fill="#9fb8bd" font-size="13">上电</text>
  </g>

  <g font-family="Microsoft YaHei, sans-serif">
    <rect x="48" y="470" width="540" height="120" rx="12" fill="#0d2328" stroke="#8a4b3a"/>
    <text x="72" y="506" fill="#f6c177" font-size="19">非法跳转示例</text>
    <text x="72" y="538" fill="#d7ece9" font-size="15">待机 → 开始工作：被拦下。</text>
    <text x="72" y="566" fill="#9fb8bd" font-size="14">状态机只认合法出口，跳步要报错，不能静默放行。</text>

    <rect x="612" y="470" width="540" height="120" rx="12" fill="#0d2328" stroke="#2b5b63"/>
    <text x="636" y="506" fill="#8fe3d8" font-size="19">调试口诀</text>
    <text x="636" y="538" fill="#d7ece9" font-size="15">状态要少，出口要清，日志留痕。</text>
    <text x="636" y="566" fill="#9fb8bd" font-size="14">卡住时先看「谁该发事件」和「谁没收到」。</text>
  </g>

  <text x="48" y="632" fill="#6f8f99" font-family="Microsoft YaHei, sans-serif" font-size="15">教学示意：真实固件里，状态机写在主循环里；每次转移都要留一条日志，方便复盘。</text>
</svg>
