<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="三个故障叠加，二分找真凶">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE ECHO SPIRE / 检修手册 · K8-02 · 终局</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">三个故障叠加，二分找真凶</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="1088" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  
    <rect x="90" y="210" width="420" height="100" rx="10" fill="#0e1d27" stroke="#2a4a5e"/>
    <text class="zh" x="116" y="252" fill="#f2c56b" font-size="19">故障 A</text>
    <text class="zh" x="240" y="252" fill="#e8eef2" font-size="16">回流线虚接</text>
    <text class="zh" x="460" y="252" fill="#8aa0ad" font-size="16">压降偏大</text>
    <rect x="90" y="330" width="420" height="100" rx="10" fill="#0e1d27" stroke="#2a4a5e"/>
    <text class="zh" x="116" y="372" fill="#ff7a6b" font-size="19">故障 B</text>
    <text class="zh" x="240" y="372" fill="#e8eef2" font-size="16">继电器反峰</text>
    <text class="zh" x="460" y="372" fill="#8aa0ad" font-size="16">控制器复位</text>
    <rect x="90" y="450" width="420" height="100" rx="10" fill="#0e1d27" stroke="#2a4a5e"/>
    <text class="zh" x="116" y="492" fill="#8aa0ad" font-size="19">故障 C</text>
    <text class="zh" x="240" y="492" fill="#e8eef2" font-size="16">参数阈值错</text>
    <text class="zh" x="460" y="492" fill="#8aa0ad" font-size="16">误报警</text>
  <rect x="560" y="210" width="584" height="370" rx="12" fill="#0e1d27" stroke="#2a4a5e"/>
  <text class="zh" x="586" y="250" fill="#6fe3c8" font-size="17">二分路径</text>
  
    <text class="zh" x="586" y="296" fill="#e8eef2" font-size="16">1. 先测供电：24V 是否稳？</text>
    <text class="zh" x="586" y="348" fill="#e8eef2" font-size="16">2. 再测回流：压降 ≤0.3V？</text>
    <text class="zh" x="586" y="400" fill="#e8eef2" font-size="16">3. 再测控制：复位是否由分断引起？</text>
    <text class="zh" x="586" y="452" fill="#e8eef2" font-size="16">4. 最后核参数：阈值与量程是否对？</text>
  <text class="zh" x="586" y="540" fill="#8aa0ad" font-size="15">每次只改一个变量，记录预期与实际。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学仿真：终局故障为教学设定；现场排障须遵守断电与安规流程。</text>
</svg>
