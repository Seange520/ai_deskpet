<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="温升曲线：热量进来，也要散出去">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes heat{0%,100%{fill:#f2c56b}50%{fill:#ff7a6b}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K1-03 · 动画</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">温升曲线：热量进来，也要散出去</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g><rect x="56" y="170" width="420" height="420" rx="10" fill="#12242f" stroke="#2a4a5e"/>
<text class="zh" x="76" y="200" fill="#6fe3c8" font-size="17">三条线，看懂热故障</text><text class="zh" x="76" y="224" fill="#e8eef2" font-size="18">① 正常：发热 = 散热，温度停住</text><text class="zh" x="76" y="256" fill="#e8eef2" font-size="18">② 过载：热量进来更快，温度往上爬</text><text class="zh" x="76" y="288" fill="#e8eef2" font-size="18">③ 短路：几秒内冲过阈值，保护要动作</text><text class="zh" x="76" y="320" fill="#e8eef2" font-size="18"></text><text class="zh" x="76" y="352" fill="#e8eef2" font-size="18">温升不是线性的：</text><text class="zh" x="76" y="384" fill="#e8eef2" font-size="18">越热，散热越跟不上，</text><text class="zh" x="76" y="416" fill="#e8eef2" font-size="18">所以故障会加速。</text></g>
<g>
  <rect x="520" y="170" width="620" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <line x1="580" y1="520" x2="1100" y2="520" stroke="#8aa0ad" stroke-width="2"/>
  <line x1="580" y1="520" x2="580" y2="210" stroke="#8aa0ad" stroke-width="2"/>
  <text class="zh" x="585" y="545" fill="#8aa0ad" font-size="16">时间 →</text>
  <text class="zh" x="540" y="230" fill="#8aa0ad" font-size="16" text-anchor="end">温度</text>
  <path d="M580 500 Q700 440 820 436 T1100 430" fill="none" stroke="#6fe3c8" stroke-width="3"/>
  <path d="M580 500 Q700 420 820 360 T1100 300" fill="none" stroke="#f2c56b" stroke-width="3"/>
  <path d="M580 500 Q660 380 740 300 T880 210" fill="none" stroke="#ff7a6b" stroke-width="3" stroke-dasharray="10 4"/>
  <line x1="580" y1="270" x2="1100" y2="270" stroke="#ff7a6b" stroke-width="2" stroke-dasharray="4 6"/>
  <text class="zh" x="1100" y="262" fill="#ff7a6b" font-size="16" text-anchor="end">阈值：该跳了</text>
  <circle cx="880" cy="210" r="7" fill="#ff7a6b"/>
  <text class="zh" x="700" y="420" fill="#6fe3c8" font-size="15">正常</text>
  <text class="zh" x="820" y="330" fill="#f2c56b" font-size="15">过载</text>
  <text class="zh" x="760" y="232" fill="#ff7a6b" font-size="15">短路</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">动画资产：曲线为确定性教学模型，用于理解趋势，不替代真实热测试。</text>
</svg>
