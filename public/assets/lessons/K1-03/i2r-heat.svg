<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="功率与发热：P = UI = I²R">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes heat{0%,100%{fill:#f2c56b}50%{fill:#ff7a6b}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K1-03</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">功率与发热：P = UI = I²R</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g><rect x="56" y="170" width="500" height="190" rx="10" fill="#12242f" stroke="#2a4a5e"/>
<text class="zh" x="76" y="200" fill="#6fe3c8" font-size="17">三个写法，同一个功率</text><text class="zh" x="76" y="224" fill="#e8eef2" font-size="18">P = U × I</text><text class="zh" x="76" y="256" fill="#e8eef2" font-size="18">P = I² × R（电流流过电阻时）</text><text class="zh" x="76" y="288" fill="#e8eef2" font-size="18">P = U² / R（电压压在电阻上时）</text></g>
<g><rect x="56" y="390" width="500" height="170" rx="10" fill="#12242f" stroke="#2a4a5e"/>
<text class="zh" x="76" y="420" fill="#6fe3c8" font-size="17">发热从哪来</text><text class="zh" x="76" y="444" fill="#e8eef2" font-size="18">电能没变成光/声/动能的部分</text><text class="zh" x="76" y="476" fill="#e8eef2" font-size="18">在电阻上变成热：I²R</text><text class="zh" x="76" y="508" fill="#e8eef2" font-size="18">功率越大、散热越差，温升越高</text></g>
<g>
  <rect x="620" y="170" width="520" height="250" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="646" y="204" fill="#6fe3c8" font-size="17">例：2A 流过 0.5Ω 接点</text>
  <text class="num" x="646" y="252" fill="#f2c56b" font-size="30">P = 2² × 0.5 = 2W</text>
  <text class="zh" x="646" y="300" fill="#e8eef2" font-size="18">同样的电流，电阻翻倍 → 发热翻倍</text>
  <text class="zh" x="646" y="336" fill="#e8eef2" font-size="18">电流翻倍 → 发热变四倍（I² 的脾气）</text>
  <text class="zh" x="646" y="372" fill="#8aa0ad" font-size="16">选型时留足功率裕量，不让接点先烧</text>
</g>
<g>
  <rect x="620" y="450" width="520" height="130" rx="12" fill="none" stroke="#2a4a5e" stroke-dasharray="6 8"/>
  <text class="zh" x="646" y="486" fill="#6fe3c8" font-size="17">检修判断</text>
  <text class="zh" x="646" y="524" fill="#e8eef2" font-size="17">摸到异常发热，先量电流，再算功率</text>
  <text class="zh" x="646" y="556" fill="#8aa0ad" font-size="16">不发烫不代表没问题；发烫一定先断电</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学模型：功率与温升为确定性仿真，不代表真实器件认证曲线。</text>
</svg>
