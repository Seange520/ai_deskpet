<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="WiFi 连接：一张状态机">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes sweep{0%{transform:translateX(0)}100%{transform:translateX(640px)}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE ECHO / 检修手册 · K5-01</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">WiFi 连接：一张状态机</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="1088" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <g><rect x="120" y="220" width="220" height="100" rx="8" fill="#0e1d27" stroke="#6fe3c8" stroke-width="2"/>
<text class="zh" x="230" y="254" text-anchor="middle" fill="#6fe3c8" font-size="19">断开</text>
<text class="zh" x="230" y="282" text-anchor="middle" fill="#8aa0ad" font-size="15">IDLE</text></g>
  <g><rect x="490" y="220" width="220" height="100" rx="8" fill="#0e1d27" stroke="#f2c56b" stroke-width="2"/>
<text class="zh" x="600" y="254" text-anchor="middle" fill="#f2c56b" font-size="19">连接中</text>
<text class="zh" x="600" y="282" text-anchor="middle" fill="#8aa0ad" font-size="15">CONNECTING</text></g>
  <g><rect x="860" y="220" width="220" height="100" rx="8" fill="#0e1d27" stroke="#6fe3c8" stroke-width="2"/>
<text class="zh" x="970" y="254" text-anchor="middle" fill="#6fe3c8" font-size="19">已连接</text>
<text class="zh" x="970" y="282" text-anchor="middle" fill="#8aa0ad" font-size="15">CONNECTED</text></g>
  <g><rect x="490" y="420" width="220" height="100" rx="8" fill="#0e1d27" stroke="#ff7a6b" stroke-width="2"/>
<text class="zh" x="600" y="454" text-anchor="middle" fill="#ff7a6b" font-size="19">重连等待</text>
<text class="zh" x="600" y="482" text-anchor="middle" fill="#8aa0ad" font-size="15">RETRYING</text></g>
  <line x1="340" y1="270" x2="490" y2="270" stroke="#6fe3c8" stroke-width="3"/>
  <line x1="710" y1="270" x2="860" y2="270" stroke="#6fe3c8" stroke-width="3"/>
  <line x1="970" y1="320" x2="600" y2="420" stroke="#ff7a6b" stroke-width="3" stroke-dasharray="8 6"/>
  <line x1="490" y1="470" x2="230" y2="320" stroke="#f2c56b" stroke-width="3" stroke-dasharray="8 6"/>
  <text class="zh" x="600" y="410" fill="#8aa0ad" font-size="16">掉线</text>
  <text class="zh" x="240" y="400" fill="#8aa0ad" font-size="16">退避后重试</text>
  <text class="zh" x="86" y="560" fill="#8aa0ad" font-size="16">重连要有退避与上限，别让 MCU 卡在 while 里。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学示例：真实 WiFi 还需处理 DNS、信号强度、省电与证书。</text>
</svg>
