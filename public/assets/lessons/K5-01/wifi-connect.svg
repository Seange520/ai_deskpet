<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="连上之后，先读状态">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes sweep{0%{transform:translateX(0)}100%{transform:translateX(640px)}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE ECHO / 检修手册 · K5-01 · 连接演练</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">连上之后，先读状态</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="520" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="82" y="204" fill="#6fe3c8" font-size="17">连接步骤</text>
  <text class="zh" x="82" y="250" fill="#e8eef2" font-size="18">① 配 SSID / 密码（不入库）</text><text class="zh" x="82" y="300" fill="#e8eef2" font-size="18">② 启动连接，等状态回调</text><text class="zh" x="82" y="350" fill="#e8eef2" font-size="18">③ 连上后读 IP / RSSI</text><text class="zh" x="82" y="400" fill="#e8eef2" font-size="18">④ 失败：记录状态码，退避重试</text><text class="zh" x="82" y="450" fill="#e8eef2" font-size="18">⑤ 成功后保持看门狗</text>
</g>
<g>
  <rect x="620" y="170" width="524" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="646" y="204" fill="#6fe3c8" font-size="17">状态读数</text>
  <rect x="646" y="232" width="470" height="130" rx="8" fill="#0e1d27" stroke="#6fe3c8" stroke-width="2"/>
  <text class="num" x="670" y="280" fill="#6fe3c8" font-size="18">state = connected</text>
  <text class="num" x="670" y="318" fill="#6fe3c8" font-size="18">rssi = -55 dBm</text>
  <text class="num" x="670" y="356" fill="#6fe3c8" font-size="18">ip = 192.168.1.42</text>
  <text class="zh" x="646" y="420" fill="#e8eef2" font-size="17">-55dBm：信号可以；-80dBm 以下：先靠近 AP</text>
  <text class="zh" x="646" y="480" fill="#8aa0ad" font-size="16">别只看“连上了”——状态码与读数才是证据。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">教学示例：界面不回显密码；真实连接依赖路由器与频段。</text>
</svg>
