<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="万用表：先选对档，再碰电路">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE FORGE / 检修手册 · K0-02</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">万用表：先选对档，再碰电路</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>
<g>
  <rect x="58" y="150" width="250" height="52" rx="8" fill="none" stroke="#6fe3c8" stroke-dasharray="0"/><text class="zh" x="183" y="184" text-anchor="middle" fill="#e8eef2" font-size="19">1 选档</text><rect x="344" y="150" width="250" height="52" rx="8" fill="none" stroke="#6fe3c8" stroke-dasharray="4 6"/><text class="zh" x="469" y="184" text-anchor="middle" fill="#e8eef2" font-size="19">2 插表笔</text><rect x="630" y="150" width="250" height="52" rx="8" fill="none" stroke="#6fe3c8" stroke-dasharray="4 6"/><text class="zh" x="755" y="184" text-anchor="middle" fill="#e8eef2" font-size="19">3 并联测量</text><rect x="916" y="150" width="250" height="52" rx="8" fill="none" stroke="#6fe3c8" stroke-dasharray="4 6"/><text class="zh" x="1041" y="184" text-anchor="middle" fill="#e8eef2" font-size="19">4 读数记单位</text>
  <rect x="380" y="228" width="440" height="380" rx="16" fill="#12242f" stroke="#2a4a5e" stroke-width="2"/>
  <circle cx="600" cy="360" r="106" fill="#0e1d27" stroke="#2a4a5e" stroke-width="3"/>
  <g class="num" fill="#e8eef2" font-size="16">
    <text x="600" y="272" text-anchor="middle">V⎓ 20</text>
    <text x="692" y="335" text-anchor="middle">V~ 600</text>
    <text x="692" y="410" text-anchor="middle">Ω 2k</text>
    <text x="600" y="452" text-anchor="middle">通断</text>
    <text x="508" y="410" text-anchor="middle">A⎓ 10A</text>
    <text x="508" y="335" text-anchor="middle">OFF</text>
  </g>
  <line x1="600" y1="360" x2="600" y2="272" stroke="#f2c56b" stroke-width="6" stroke-linecap="round"/>
  <circle cx="600" cy="360" r="9" fill="#f2c56b"/>
  <text class="zh" x="600" y="500" text-anchor="middle" fill="#6fe3c8" font-size="19">档位指向 V⎓ 20 —— 测 24V 直流</text>
  <g>
    <circle cx="480" cy="552" r="20" fill="#0b1620" stroke="#ff7a6b" stroke-width="3"/><text class="num" x="480" y="559" text-anchor="middle" fill="#ff7a6b" font-size="14">10A</text>
    <circle cx="545" cy="552" r="20" fill="#0b1620" stroke="#2a4a5e" stroke-width="3"/><text class="num" x="545" y="559" text-anchor="middle" fill="#8aa0ad" font-size="12">COM</text>
    <circle cx="610" cy="552" r="20" fill="#0b1620" stroke="#6fe3c8" stroke-width="3"/><text class="num" x="610" y="559" text-anchor="middle" fill="#6fe3c8" font-size="12">VΩ</text>
  </g>
  <text class="zh" x="600" y="592" text-anchor="middle" fill="#8aa0ad" font-size="14">红笔 VΩ，黑笔 COM；量电流才换 10A 孔</text>
  </g>
<text class="zh" x="56" y="645" fill="#8aa0ad" font-size="16">错档的代价：电阻档碰了带电线圈，轻则读数溢出，重则保险丝先断。</text>
</svg>
