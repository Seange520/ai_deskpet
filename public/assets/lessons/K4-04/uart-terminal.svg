<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="把字节拼回一句人话">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16303f" stroke-width="1"/></pattern>
<style>
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.num{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-80}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes sweep{0%{transform:translateX(0)}100%{transform:translateX(640px)}}
</style>
</defs>
<rect width="1200" height="675" fill="#0b1620"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1164" height="639" fill="none" stroke="#2a4a5e" stroke-width="2"/>
<text class="zh" x="56" y="66" fill="#6fe3c8" font-size="19" letter-spacing="3">THE WEAVE / 检修手册 · K4-04 · 拼报文</text>
<text class="zh" x="56" y="110" fill="#e8eef2" font-size="34" font-weight="700">把字节拼回一句人话</text>
<line x1="56" y1="130" x2="1144" y2="130" stroke="#2a4a5e" stroke-width="2"/>

<g>
  <rect x="56" y="170" width="520" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="82" y="204" fill="#6fe3c8" font-size="17">收到的字节流</text>
  
    <text class="num" x="82" y="256" fill="#e8eef2" font-size="18">0x4C</text>
    <text class="num" x="82" y="296" fill="#e8eef2" font-size="18">0x49</text>
    <text class="num" x="82" y="336" fill="#e8eef2" font-size="18">0x47</text>
    <text class="num" x="82" y="376" fill="#e8eef2" font-size="18">0x48</text>
    <text class="num" x="82" y="416" fill="#e8eef2" font-size="18">0x54</text>
    <text class="num" x="82" y="456" fill="#e8eef2" font-size="18">0x3D</text>
    <text class="num" x="82" y="496" fill="#e8eef2" font-size="18">0x4F</text>
    <text class="num" x="82" y="536" fill="#e8eef2" font-size="18">0x4E</text>
  <text class="zh" x="82" y="520" fill="#8aa0ad" font-size="16">字节按顺序拼接，再按 ASCII 解码。</text>
</g>
<g>
  <rect x="620" y="170" width="524" height="420" rx="12" fill="#12242f" stroke="#2a4a5e"/>
  <text class="zh" x="646" y="204" fill="#6fe3c8" font-size="17">解码结果</text>
  <rect x="646" y="232" width="470" height="100" rx="8" fill="#0e1d27" stroke="#6fe3c8" stroke-width="2"/>
  <text class="num" x="666" y="294" fill="#6fe3c8" font-size="20">LIGHT=ON</text>
  <text class="zh" x="646" y="380" fill="#e8eef2" font-size="17">若波特率错：0x4C 可能读成 0x98 → 乱码</text>
  <text class="zh" x="646" y="416" fill="#e8eef2" font-size="17">若位序/校验错：内容整体错乱</text>
  <text class="zh" x="646" y="470" fill="#8aa0ad" font-size="16">先确认“能收到”，再确认“拼得对”。</text>
</g>
<text class="zh" x="56" y="641" fill="#8aa0ad" font-size="16">仿真演练：字节流与解码为教学示例，真实协议可能有帧头/校验/长度。</text>
</svg>
